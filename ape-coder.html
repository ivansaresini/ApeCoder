<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ape Coder</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:600 800;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
/* Layout: arcade a schermo unico, sempre in tema chiaro (prato e cielo): barra stato, griglia quadrata, riga del codice, tastiera grande */
:root{
  --sky:#dcf1fb; --meadow:#9bd56a; --meadow2:#b4e284; --honey:#f6b73c; --honey-d:#c98610;
  --ink:#3b2a10; --ink-soft:#7a6240; --paper:#fffaf0; --danger:#c0332a; --ok:#2a7527; --sky-d:#2d7fc1;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
button{font-family:var(--display);font-weight:700;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}

/* barra stato */
.stato{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--paper);border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:15px}
.stato .nome{font-family:var(--display);font-size:18px;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stato .vite{letter-spacing:2px;font-size:18px}
.stato .punti{font-family:var(--display);font-size:22px;color:var(--honey-d)}
.stato small{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stato > div{white-space:nowrap;flex-shrink:0}
.stato .nome{flex-shrink:1}
@media (max-width:480px){.stato{padding:6px 8px;gap:6px}.stato small{display:none}.stato .vite{letter-spacing:0;font-size:16px}.stato .nome{max-width:28%;font-size:16px}.stato .punti{font-size:20px}}

/* griglia */
.campo{position:relative;width:min(100%,520px,calc(100dvh - 350px));aspect-ratio:1;max-width:100%;
  background:var(--meadow);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 #6fae43}
.griglia{position:absolute;inset:0;display:grid}
.cella{border:1px solid rgba(255,255,255,.28)}
.cella:nth-child(odd){background:var(--meadow2)}
.ent{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1}
.ent .em{font-size:calc(var(--cella) * .66)}
.albero .tempo{position:absolute;bottom:3%;right:5%;background:var(--paper);border-radius:999px;padding:1px 5px;line-height:1.2;
  font-family:var(--display);font-size:max(12px,calc(var(--cella) * .26));color:var(--ink);min-width:1.6em;text-align:center}
.albero.urgente{animation:lampeggia .4s steps(2) infinite}
.albero.urgente .tempo{background:var(--danger);color:#fff}
@keyframes lampeggia{to{opacity:.35}}
.ape{transition:left .28s linear,top .28s linear;z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.ape.salto{transition:none}
.errore{border:4px solid var(--danger);border-radius:8px;z-index:2;box-shadow:0 0 0 2px rgba(255,255,255,.6) inset}
.alveare svg{width:78%;height:78%}
.fiore{animation:spunta .4s ease-out}
@keyframes spunta{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.albero.urgente,.fiore{animation:none}.ape{transition-duration:.05s}}

/* messaggio e riga del codice */
.msg{height:22px;line-height:22px;font-size:clamp(13px,3.9vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft);text-align:center;width:100%;max-width:520px}
.msg.bene{color:var(--ok)}.msg.male{color:var(--danger)}
.codice{width:100%;max-width:520px;min-height:48px;max-height:76px;overflow-y:auto;background:var(--paper);border-radius:14px;padding:6px 10px;
  display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:6px;font-family:var(--display);font-size:20px}
.codice .vuoto{color:var(--ink-soft);font-size:15px;font-family:var(--body)}
.chip{background:var(--honey);color:var(--ink);border-radius:10px;padding:2px 10px;line-height:1.3}
.chip:not(:last-child)::after{content:"";}

/* tastiera */
.pad{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;grid-template-rows:repeat(3,54px);gap:8px}
.pad button{border-radius:14px;font-size:28px;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 #d9cdb3}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cdb3}
.pad .su{grid-column:2;grid-row:1}.pad .sx{grid-column:1;grid-row:2}.pad .giu{grid-column:2;grid-row:2}.pad .dx{grid-column:3;grid-row:2}
.pad .canc{grid-column:1;grid-row:1;font-size:22px}.pad .nulla{grid-column:3;grid-row:1;font-size:22px}
.pad .invia{grid-column:4;grid-row:1/4;background:var(--honey);box-shadow:0 4px 0 var(--honey-d);font-size:24px;letter-spacing:.04em}
.pad .invia:active{box-shadow:0 1px 0 var(--honey-d)}
.pad .aiuto{grid-column:1/4;grid-row:3;font-family:var(--body);font-size:13px;color:var(--ink-soft);box-shadow:none;background:transparent;font-weight:600}
.pad button:disabled{opacity:.45;transform:none;box-shadow:none}
.pad .aiuto:disabled{opacity:1}

/* schermate sovrapposte */
.velo{position:fixed;inset:0;background:rgba(40,30,10,.55);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:20}
.scheda{background:var(--paper);border-radius:22px;padding:22px 20px;width:100%;max-width:420px;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.scheda h1{font-size:34px;color:var(--honey-d)}
.scheda h2{font-size:30px}
.scheda p{margin:0;line-height:1.45}
.scheda input{font:inherit;font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid var(--honey);text-align:center;width:100%}
.livelli{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.partenza{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:17px}
.partenza select{font:inherit;font-size:18px;padding:6px 10px;border-radius:12px;border:2px solid var(--honey);background:var(--sky);color:var(--ink)}
.livelli label{position:relative;display:block}
.livelli input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.livelli span{display:block;padding:12px 2px;border-radius:12px;background:var(--sky);font-family:var(--display);font-size:clamp(13px,3.8vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid transparent;min-height:44px}
.livelli input:checked + span{background:var(--honey);border-color:var(--honey-d)}
.livelli input:focus-visible + span{outline:3px solid var(--sky-d);outline-offset:2px}
.scheda{position:relative}
.casa{position:absolute;top:8px;left:8px;width:44px;height:44px;display:grid;place-items:center;font-size:24px;text-decoration:none;line-height:1;padding:0;border-radius:12px}
.casa:hover{background:var(--sky)}
.grande{background:var(--honey);color:var(--ink);border-radius:14px;padding:12px 18px;font-size:22px;box-shadow:0 4px 0 var(--honey-d)}
.grande:active{transform:translateY(3px);box-shadow:0 1px 0 var(--honey-d)}
.regole{text-align:left;font-size:15px;display:grid;gap:6px;padding:0;margin:0;list-style:none}
.regole li{display:flex;gap:10px;align-items:center}
.regole .em{font-size:24px;flex:0 0 46px;text-align:center}
.regole .frecce{display:inline-flex;justify-content:center;gap:3px;line-height:1}
.regole .frecce i{font-style:normal;font-size:13px;width:20px;height:20px;display:grid;place-items:center;background:var(--honey);border-radius:6px;color:var(--ink)}
.curiosita{background:var(--sky);border-radius:14px;padding:12px;text-align:left}
.curiosita b{font-family:var(--display);color:var(--sky-d)}
.classifica{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.classifica li{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;padding:4px 8px;border-radius:8px;font-size:16px}
.classifica li.io{background:var(--honey)}
.classifica li span:last-child{color:var(--ink-soft);font-size:13px}
.classifica .pt{font-family:var(--display);font-size:18px}
.esito{font-family:var(--display);font-size:52px;color:var(--honey-d);line-height:1}
@media (max-height:720px){.scheda{padding:16px 16px;gap:10px}.scheda h1{font-size:30px}.scheda p{font-size:15px;line-height:1.35}.regole{gap:4px;font-size:14px}.regole .em{font-size:20px;flex-basis:36px}#classificaInizio .classifica li{padding:2px 8px;font-size:14px}}
[hidden]{display:none!important}
.stato .esci{flex:0 0 auto;width:36px;height:36px;margin:-4px 0 -4px -6px;padding:0;display:grid;place-items:center;font-size:20px;background:transparent;border-radius:10px;line-height:1;box-shadow:none}
.azioni2{display:flex;gap:10px}
.azioni2 button{flex:1;border-radius:14px;padding:12px 8px;font-size:18px;color:var(--ink)}
.azioni2 .salva{background:var(--honey);box-shadow:0 4px 0 var(--honey-d)}
.azioni2 .resta{background:var(--sky)}
.stato .esci{position:relative}
.stato .esci::before{content:"";position:absolute;inset:-6px}
.azioni2 button{line-height:1.2;font-size:clamp(16px,4.6vw,18px)}
@media (max-width:400px){.azioni2{flex-direction:column}}
@media (max-height:720px){.grado{padding:8px 10px;gap:2px}.grado .gEm{font-size:36px}.grado .gTit{font-size:19px}.grado .gNota{font-size:13px;line-height:1.3}#classificaFine li{padding:2px 8px;font-size:14px}}
#schermoFine .grande{position:sticky;bottom:0;box-shadow:0 4px 0 var(--honey-d),0 -10px 10px var(--paper)}
.stato .esci:active{background:var(--sky)}
.grado{background:var(--sky);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.grado .gEm{font-size:44px;line-height:1}
.grado .gTit{font-family:var(--display);font-size:22px;color:var(--sky-d)}
.grado .gNota{font-size:14px;line-height:1.4}
.grado small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
</style>
</head>
<body>


<div class="stato" id="stato" hidden>
  <button class="esci" id="bEsci" aria-label="Menu">🏠</button>
  <div class="nome" id="sNome">—</div>
  <div><small id="sDiff">Facile</small> <b id="sLivello">1</b></div>
  <div class="vite" id="sVite">❤️❤️❤️</div>
  <div class="punti" id="sPunti">0</div>
</div>

<div class="campo" id="campo" hidden><div class="griglia" id="griglia"></div></div>
<div class="msg" id="msg" hidden></div>
<div class="codice" id="codice" hidden></div>

<div class="pad" id="pad" hidden>
  <button class="canc" id="bCanc" aria-label="Cancella ultimo comando">✕</button>
  <button class="su" data-d="U" aria-label="Su">▲</button>
  <button class="nulla" id="bSvuota" aria-label="Svuota tutto">🗑️</button>
  <button class="sx" data-d="L" aria-label="Sinistra">◀</button>
  <button class="giu" data-d="D" aria-label="Giù">▼</button>
  <button class="dx" data-d="R" aria-label="Destra">▶</button>
  <button class="invia" id="bInvia" data-t="invia"></button>
  <button class="aiuto" id="bAiuto" data-t="aiuto" disabled></button>
</div>

<div class="velo" id="schermoInizio">
  <form class="scheda" id="formInizio">
    <a class="casa" href="index.html" aria-label="Torna al menu">🏠</a>
    <h1 data-t="titolo"></h1>
    <p data-t="intro"></p>
    <ul class="regole">
      <li><span class="em frecce"><i>▲</i><i>▶</i></span><span data-t="r1"></span></li>
      <li><span class="em">🍯</span><span data-t="r2"></span></li>
      <li><span class="em">🕸️</span><span data-t="r3"></span></li>
      <li><span class="em">🌸</span><span data-t="r4"></span></li>
    </ul>
    <input id="inNome" maxlength="10" data-ph="nome" autocomplete="off" required>
    <div class="livelli" role="radiogroup" aria-label="Difficoltà">
      <label><input type="radio" name="diff" value="facile" id="dFacile" checked><span data-t="facile"></span></label>
      <label><input type="radio" name="diff" value="medio" id="dMedio"><span data-t="medio"></span></label>
      <label><input type="radio" name="diff" value="difficile" id="dDifficile"><span data-t="difficile"></span></label>
      <label><input type="radio" name="diff" value="senzafretta" id="dSenzafretta"><span data-t="senzafretta"></span></label>
    </div>
    <label class="partenza"><span data-t="partiDa"></span> <select id="inLivello"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label>
    <button class="grande" type="submit" data-t="gioca"></button>
    <div id="classificaInizio"></div>
  </form>
</div>

<div class="velo" id="schermoLivello" hidden>
  <div class="scheda">
    <div class="esito">🎉</div>
    <h2 id="lvTitolo">Livello 2!</h2>
    <p id="lvTesto"></p>
    <div class="curiosita"><b data-t="sapevi"></b><br><span id="lvCuriosita"></span></div>
    <button class="grande" id="bContinua" data-t="continua"></button>
  </div>
</div>

<div class="velo" id="schermoEsci" hidden>
  <div class="scheda">
    <div class="esito">🏠</div>
    <h2 data-t="esciTitolo"></h2>
    <p id="esciTesto"></p>
    <div class="azioni2"><button class="resta" id="bResta" data-t="esciContinua"></button><button class="salva" id="bSalvaEsci" data-t="esciSalva"></button></div>
  </div>
</div>

<div class="velo" id="schermoFine" hidden>
  <div class="scheda">
    <div class="esito">🍯</div>
    <h2 data-t="fine"></h2>
    <p id="fnTesto"></p>
    <div class="grado" id="fnGrado"></div>
    <ol class="classifica" id="classificaFine"></ol>
    <button class="grande" id="bRigioca" data-t="rigioca"></button>
  </div>
</div>

<script>
// ===================== CONFIG: tutti i numeri da ritoccare =====================
const CONFIG = {
  vite: 3, viteMax: 5, vitaOgniLivelli: 3,          // vite iniziali, massimo, +1 ogni N livelli
  tempoScrittura: 12, riduzionePerLivello: 0.10, tempoMin: 4,   // secondi per scrivere il codice
  msPerCella: 300,                                   // velocità di volo
  grigliaMin: 6, grigliaMax: 10,
  alberiPerLivello: [1, 1, 1, 2, 2, 3],              // oltre l'ultimo valore si ripete
  ragnateleDalLivello: 2, ragnateleMax: 6,           // ragnatele = livello-1, fino al massimo
  fiore: { durata: 8, prob: 0.33, probUnaVita: 0.7, punti: 30 },
  punti: { base: 100, bonusVelocita: 100, bonusCorto: 50, serieStep: 0.10, serieMax: 0.5 },
  soglie: [500, 1200, 2100, 3200, 4500, 6000, 7700, 9600, 11700, 14000, 16500, 19200],
  classificaMax: 10,
};
// Quattro difficoltà: sovrascrivono i valori di CONFIG qui sopra all'inizio di ogni partita
const DIFFICOLTA = {
  facile:      { nome: "Facile",    tempoScrittura: 25, riduzionePerLivello: 0.05, tempoMin: 10, msPerCella: 400, vite: 5, ragnateleDalLivello: 4, senzaTempo: false },
  medio:       { nome: "Medio",     tempoScrittura: 18, riduzionePerLivello: 0.08, tempoMin: 6,  msPerCella: 350, vite: 4, ragnateleDalLivello: 3, senzaTempo: false },
  difficile:   { nome: "Difficile", tempoScrittura: 12, riduzionePerLivello: 0.10, tempoMin: 4,  msPerCella: 300, vite: 3, ragnateleDalLivello: 2, senzaTempo: false },
  senzafretta: { nome: "Senza fretta", tempoScrittura: 25, riduzionePerLivello: 0.05, tempoMin: 10, msPerCella: 400, vite: 5, ragnateleDalLivello: 4, senzaTempo: true },  // come Facile, ma il tempo non scade mai
};
// ===================== lingua (scelta nella pagina principale) =====================
function leggiLingua() { try { const l = localStorage.getItem("scuolaApe.lingua"); if (l === "it" || l === "en") return l; } catch (e) {} return (navigator.language || "it").toLowerCase().startsWith("en") ? "en" : "it"; }
const L = leggiLingua();
const T = {
  it: { titolo: "🐝 Ape Coder", intro: "Scrivi il codice per portare l'ape dall'alveare all'albero col miele, prima che il miele finisca!",
    r1: "Ogni freccia è un passo. Tocca due volte la stessa per fare 2 passi.", r2: "Premi ESEGUI: l'ape vola. Se atterra sull'albero, punti!",
    r3: "Se atterra su una ragnatela perde una vita (passarci sopra in volo non fa niente).", r4: "Passa sopra un fiore per riprendere una vita.",
    nome: "Il tuo nome", facile: "🐣 Facile", medio: "🐝 Medio", difficile: "🔥 Difficile", senzafretta: "🐢 Senza fretta", partiDa: "Parti dal livello", gioca: "GIOCA", invia: "ESEGUI",
    aiuto: "Tocca una freccia per aggiungere un passo. Il tempo di ogni albero è scritto sotto di lui.",
    sapevi: "Lo sapevi?", continua: "CONTINUA", fine: "Fine del gioco", rigioca: "RIGIOCA", liv: "Liv.", livello: "Livello",
    vuoto: "Scrivi qui il codice con le frecce…", porta: "Porta l'ape all'albero 🌳 col miele!", nuovoLiv: "Nuovo livello: la griglia è più grande!",
    livCentroBasso: "Ora l'alveare è in mezzo: ti serviranno anche ◀ e ▼!", livCentro: "L'alveare è al centro del prato.", dueAlberi: "Due alberi! Scegli quello con meno secondi.",
    appassito: "Il fiore è appassito.", tardi: "Troppo tardi! Il miele è finito. −1 vita", ragnatela: "Ahi, una ragnatela! −1 vita", noMiele: "Qui non c'è miele.",
    correggi: "Correggi il codice e riprova", bordo: "L'ape è arrivata al bordo del prato e si è fermata. Conta bene le caselle!",
    consegnato: "Miele consegnato!", corto: n => ` Hai usato solo ${n} comandi: è il minimo!`, serie: " · serie ×", fiore: "Fiore! +1 vita e +",
    lvTesto: (p, s) => `Hai ${p} punti. Ora hai ${s} secondi per scrivere il codice.`, vitaExtra: " Hai guadagnato una vita in più! ❤️",
    fnTesto: (n, p, d, l) => `${n}, hai fatto ${p} punti (${d}) e sei arrivato al livello ${l}.`, posizione: p => ` Sei in classifica al posto ${p}!`,
    nessuno: "Nessun punteggio ancora. Sarai il primo!", esciTitolo: "Vuoi uscire?", esciTesto: p => `Hai ${p} punti: li metto nella classifica di questo dispositivo, poi torni al menu.`, esciNiente: "Non hai ancora fatto punti: esco senza salvare.", esciSalva: "Salva ed esci", esciSolo: "Esci", esciContinua: "Continua a giocare",
    gradi: [[1, "🐛", "Larva", "Hai appena aperto gli occhi e già vuoi programmare: il prato ti aspetta!"], [3, "🍼", "Ape nutrice", "Ti prendi cura delle piccole cose, ed è così che si cresce. Avanti!"], [5, "🛡️", "Ape guardiana", "Stai all'ingresso dell'alveare e nulla ti sfugge: che attenzione!"], [7, "🌸", "Ape bottinatrice", "Voli di fiore in fiore e torni carica di nettare: l'alveare conta su di te!"], [9, "👑", "Ape regina", "Tutto l'alveare lavora con te: con il codice lo hai conquistato!"]],
    gradoTitolo: "Sei un'ape di grado:", diffNomi: { facile: "Facile", medio: "Medio", difficile: "Difficile", senzafretta: "Senza fretta" },
    curiosita: ["Un'ape in tutta la sua vita produce solo poche gocce di miele: meno di un cucchiaino!", "Le api comunicano con una danza: la direzione del ballo indica dove sono i fiori.",
      "In un alveare vivono fino a 60.000 api, ma c'è una sola regina.", "Le api vedono i colori diversamente da noi: non vedono il rosso, ma vedono l'ultravioletto.",
      "Per fare un chilo di miele le api visitano circa 4 milioni di fiori.", "Le api battono le ali più di 200 volte al secondo: ecco da dove viene il ronzio."] },
  en: { titolo: "🐝 Bee Coder", intro: "Write the code to take the bee from the hive to the honey tree, before the honey runs out!",
    r1: "Each arrow is one step. Tap the same arrow twice for 2 steps.", r2: "Press RUN: the bee flies. Land on the tree to score!",
    r3: "Landing on a spider web costs a life (flying over it is fine).", r4: "Fly over a flower to get a life back.",
    nome: "Your name", facile: "🐣 Easy", medio: "🐝 Medium", difficile: "🔥 Hard", senzafretta: "🐢 No rush", partiDa: "Start at level", gioca: "PLAY", invia: "RUN",
    aiuto: "Tap an arrow to add a step. Each tree's time is written under it.",
    sapevi: "Did you know?", continua: "CONTINUE", fine: "Game over", rigioca: "PLAY AGAIN", liv: "Lv.", livello: "Level",
    vuoto: "Write your code here with the arrows…", porta: "Take the bee to the honey tree 🌳!", nuovoLiv: "New level: the grid is bigger!",
    livCentroBasso: "The hive is now in the middle: you'll need ◀ and ▼ too!", livCentro: "The hive is in the centre of the meadow.", dueAlberi: "Two trees! Pick the one with fewer seconds.",
    appassito: "The flower wilted.", tardi: "Too late! The honey is gone. −1 life", ragnatela: "Ouch, a spider web! −1 life", noMiele: "No honey here.",
    correggi: "Fix your code and try again", bordo: "The bee reached the edge of the meadow and stopped. Count the squares carefully!",
    consegnato: "Honey delivered!", corto: n => ` You used only ${n} commands: that's the minimum!`, serie: " · streak ×", fiore: "Flower! +1 life and +",
    lvTesto: (p, s) => `You have ${p} points. You now get ${s} seconds to write your code.`, vitaExtra: " You earned an extra life! ❤️",
    fnTesto: (n, p, d, l) => `${n}, you scored ${p} points (${d}) and reached level ${l}.`, posizione: p => ` You are number ${p} on the leaderboard!`,
    nessuno: "No scores yet. You'll be the first!", esciTitolo: "Leave the game?", esciTesto: p => `You have ${p} points: I'll put them on this device's leaderboard, then back to the menu.`, esciNiente: "No points yet: I'll leave without saving.", esciSalva: "Save and leave", esciSolo: "Leave", esciContinua: "Keep playing",
    gradi: [[1, "🐛", "Larva", "You've just opened your eyes and you already want to code: the meadow is waiting!"], [3, "🍼", "Nurse bee", "You take care of the small things, and that's how you grow. Onward!"], [5, "🛡️", "Guard bee", "You stand at the hive entrance and nothing gets past you: what focus!"], [7, "🌸", "Forager bee", "You fly from flower to flower and come back full of nectar: the hive counts on you!"], [9, "👑", "Queen bee", "The whole hive works with you: with code you've conquered it!"]],
    gradoTitolo: "Your bee rank:", diffNomi: { facile: "Easy", medio: "Medium", difficile: "Hard", senzafretta: "No rush" },
    curiosita: ["In its whole life a bee makes only a few drops of honey: less than a teaspoon!", "Bees talk by dancing: the direction of the dance says where the flowers are.",
      "Up to 60,000 bees live in one hive, but there is only one queen.", "Bees see colours differently: they can't see red, but they can see ultraviolet.",
      "To make one kilo of honey, bees visit about 4 million flowers.", "Bees beat their wings over 200 times a second: that's where the buzz comes from."] },
};
const t = k => T[L][k];
const CURIOSITA = T[L].curiosita;
const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const FRECCIA = { U: "▲", D: "▼", L: "◀", R: "▶" };
const SVG_ALVEARE = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="6" width="24" height="7" rx="3.5" fill="#f6b73c"/><rect x="5" y="13" width="30" height="7" rx="3.5" fill="#e9a52c"/><rect x="4" y="20" width="32" height="7" rx="3.5" fill="#f6b73c"/><rect x="6" y="27" width="28" height="7" rx="3.5" fill="#e9a52c"/><circle cx="20" cy="30" r="3" fill="#3b2a10"/></svg>';

// ===================== stato =====================
const S = { nome: "", diff: "facile", livello: 1, punti: 0, vite: 3, serie: 0, N: 6, alveare: { x: 0, y: 5 },
  ape: { x: 0, y: 5 }, alberi: [], ragnatele: [], fiore: null, comandi: [], fase: "fermo", loop: null, idAlbero: 0, dueAlberiVisto: false };

const $ = id => document.getElementById(id);
const el = { stato: $("stato"), campo: $("campo"), griglia: $("griglia"), msg: $("msg"), codice: $("codice"), pad: $("pad") };

// ===================== livelli =====================
const tempoScrittura = lv => Math.max(CONFIG.tempoMin, CONFIG.tempoScrittura * Math.pow(1 - CONFIG.riduzionePerLivello, lv - 1));
const numAlberi = lv => CONFIG.alberiPerLivello[Math.min(lv, CONFIG.alberiPerLivello.length) - 1];
const sogliaLivello = lv => CONFIG.soglie[Math.min(lv, CONFIG.soglie.length) - 1] + Math.max(0, lv - CONFIG.soglie.length) * 3000;

function costruisciLivello() {
  const N = Math.min(CONFIG.grigliaMax, CONFIG.grigliaMin + S.livello - 1);
  S.N = N;
  S.alveare = S.livello <= 2 ? { x: 0, y: N - 1 } : S.livello <= 4 ? { x: Math.floor(N / 2), y: N - 1 } : { x: Math.floor(N / 2), y: Math.floor(N / 2) };
  S.ape = { ...S.alveare };
  S.alberi = []; S.ragnatele = []; S.fiore = null; S.comandi = []; S.fase = "fermo";
  el.griglia.style.gridTemplateColumns = `repeat(${N},1fr)`;
  el.griglia.style.gridTemplateRows = `repeat(${N},1fr)`;
  el.campo.style.setProperty("--cella", `calc(${el.campo.clientWidth}px / ${N})`);
  const nRag = S.livello >= CONFIG.ragnateleDalLivello ? Math.min(CONFIG.ragnateleMax, S.livello - 1) : 0;
  for (let i = 0; i < nRag; i++) { const c = cellaLibera(1); if (c) S.ragnatele.push(c); }
  for (let i = 0; i < numAlberi(S.livello); i++) nuovoAlbero();
  disegna();
}
// messaggio d'inizio livello: spiega la novità (alveare spostato, più alberi), altrimenti il generico
function messaggioLivello() {
  const dueAlberi = numAlberi(S.livello) >= 2 && !S.dueAlberiVisto;
  if (numAlberi(S.livello) >= 2) S.dueAlberiVisto = true;
  if (S.livello === 3) return t("livCentroBasso");
  if (S.livello === 5) return t("livCentro");
  if (dueAlberi) return t("dueAlberi");
  return S.livello === 1 ? t("porta") : t("nuovoLiv");
}

function occupata(x, y) {
  return (x === S.alveare.x && y === S.alveare.y) || S.alberi.some(a => a.x === x && a.y === y)
    || S.ragnatele.some(r => r.x === x && r.y === y) || (S.fiore && S.fiore.x === x && S.fiore.y === y);
}
function cellaLibera(distMin) {
  for (let t = 0; t < 200; t++) {
    const x = Math.floor(Math.random() * S.N), y = Math.floor(Math.random() * S.N);
    const d = Math.max(Math.abs(x - S.alveare.x), Math.abs(y - S.alveare.y));
    if (d >= distMin && !occupata(x, y)) return { x, y };
  }
  return null;
}
function nuovoAlbero() {
  const c = cellaLibera(2); if (!c) return;
  const dist = Math.abs(c.x - S.alveare.x) + Math.abs(c.y - S.alveare.y);
  const totale = tempoScrittura(S.livello) * 1000 + dist * CONFIG.msPerCella;
  S.alberi.push({ id: ++S.idAlbero, x: c.x, y: c.y, totale, scade: Date.now() + totale });
  const prob = S.vite === 1 ? CONFIG.fiore.probUnaVita : CONFIG.fiore.prob;
  if (!S.fiore && S.vite < CONFIG.viteMax && Math.random() < prob) {
    const f = cellaLibera(1); if (f) S.fiore = { x: f.x, y: f.y, scade: Date.now() + CONFIG.fiore.durata * 1000 };
  }
}

// ===================== disegno =====================
function pos(e, x, y) { const p = 100 / S.N; e.style.left = x * p + "%"; e.style.top = y * p + "%"; e.style.width = p + "%"; e.style.height = p + "%"; }
function ent(cls, html, x, y) { const e = document.createElement("div"); e.className = "ent " + cls; e.innerHTML = html; pos(e, x, y); return e; }
let apeEl = null;
function disegna() {
  el.griglia.innerHTML = "";
  for (let i = 0; i < S.N * S.N; i++) { const c = document.createElement("div"); c.className = "cella"; el.griglia.appendChild(c); }
  el.griglia.appendChild(ent("alveare", SVG_ALVEARE, S.alveare.x, S.alveare.y));
  S.ragnatele.forEach(r => el.griglia.appendChild(ent("ragnatela", '<span class="em">🕸️</span>', r.x, r.y)));
  S.alberi.forEach(a => { const e = ent("albero", '<span class="em">🌳</span>' + (CONFIG.senzaTempo ? "" : '<span class="tempo"></span>'), a.x, a.y); e.dataset.id = a.id; el.griglia.appendChild(e); });
  if (S.fiore) el.griglia.appendChild(ent("fiore", '<span class="em">🌸</span>', S.fiore.x, S.fiore.y));
  apeEl = ent("ape salto", '<span class="em">🐝</span>', S.ape.x, S.ape.y);
  el.griglia.appendChild(apeEl);
  requestAnimationFrame(() => apeEl.classList.remove("salto"));
  aggiornaStato(); disegnaCodice();
}
function aggiornaStato() {
  $("sNome").textContent = S.nome; $("sLivello").textContent = t("liv") + " " + S.livello; $("sDiff").textContent = t("diffNomi")[S.diff]; $("sPunti").textContent = S.punti;
  $("sVite").textContent = "❤️".repeat(S.vite) + "🤍".repeat(Math.max(0, CONFIG.viteMax - S.vite));
}
function disegnaCodice() {
  el.codice.innerHTML = S.comandi.length ? S.comandi.map(c => `<span class="chip">${FRECCIA[c.d]}${c.n > 1 ? " " + c.n : ""}</span>`).join("")
    : `<span class="vuoto">${t("vuoto")}</span>`;
  el.codice.scrollTop = el.codice.scrollHeight;
}
function messaggio(t, tipo) { el.msg.textContent = t; el.msg.className = "msg " + (tipo || ""); }

// ===================== tempo =====================
function tick() {
  const ora = Date.now();
  for (const a of [...S.alberi]) {
    if (CONFIG.senzaTempo) continue;             // Senza fretta: il miele non finisce mai
    if (ora >= a.scade) { fallito(a); return; }
    const e = el.griglia.querySelector(`.albero[data-id="${a.id}"]`); if (!e) continue;
    const sec = (a.scade - ora) / 1000;
    e.querySelector(".tempo").textContent = Math.ceil(sec);
    e.classList.toggle("urgente", sec <= 3);
  }
  if (S.fiore && ora >= S.fiore.scade) { S.fiore = null; disegna(); messaggio(t("appassito"), ""); }
}
function avviaLoop() { fermaLoop(); S.loop = setInterval(tick, 100); }
function fermaLoop() { if (S.loop) clearInterval(S.loop); S.loop = null; }

// ===================== esiti =====================
function perdiVita(testo) {
  S.vite--; S.serie = 0; aggiornaStato(); messaggio(testo, "male");
  if (S.vite <= 0) { fineGioco(); return false; }
  return true;
}
function fallito(albero) {
  S.alberi = S.alberi.filter(a => a !== albero);
  S.fase = "fermo"; S.comandi = []; S.ape = { ...S.alveare };
  if (!perdiVita(t("tardi"))) return;
  nuovoAlbero(); disegna();
}
function successo(albero) {
  const rimasto = Math.max(0, albero.scade - Date.now());
  const bonus = CONFIG.senzaTempo ? CONFIG.punti.bonusVelocita : Math.round(CONFIG.punti.bonusVelocita * rimasto / albero.totale);
  const ottimo = (albero.x !== S.alveare.x ? 1 : 0) + (albero.y !== S.alveare.y ? 1 : 0);
  const corto = S.comandi.length <= ottimo ? CONFIG.punti.bonusCorto : 0;
  const molt = 1 + Math.min(CONFIG.punti.serieMax, S.serie * CONFIG.punti.serieStep);
  const guadagno = Math.round((CONFIG.punti.base + bonus + corto) * molt);
  S.punti += guadagno; S.serie++;
  S.alberi = S.alberi.filter(a => a !== albero);
  messaggio(`${t("consegnato")} +${guadagno}` + (corto ? t("corto")(S.comandi.length) : "") + (S.serie > 1 ? `${t("serie")}${S.serie}` : ""), "bene");
  S.ape = { ...S.alveare }; S.comandi = []; S.fase = "fermo";
  if (S.punti >= sogliaLivello(S.livello)) { salitaLivello(); return; }
  nuovoAlbero(); disegna();
}
function salitaLivello() {
  fermaLoop(); S.livello++;
  let extra = "";
  if ((S.livello - 1) % CONFIG.vitaOgniLivelli === 0 && S.vite < CONFIG.viteMax) { S.vite++; extra = t("vitaExtra"); }
  $("lvTitolo").textContent = `${t("livello")} ${S.livello}!`;
  $("lvTesto").textContent = t("lvTesto")(S.punti, Math.round(tempoScrittura(S.livello))) + extra;
  $("lvCuriosita").textContent = CURIOSITA[(S.livello - 2) % CURIOSITA.length];
  $("schermoLivello").querySelector(".scheda").scrollTop = 0;
  $("schermoLivello").hidden = false; $("bContinua").focus({ preventScroll: true });
}
function fineGioco() {
  fermaLoop(); S.fase = "fine";
  const classifica = salvaPunteggio(S.nome, S.punti, S.livello, S.livelloPartenza);
  const posizione = classifica.findIndex(r => r.io) + 1;
  $("fnTesto").textContent = t("fnTesto")(S.nome, S.punti, t("diffNomi")[S.diff], S.livello) + (posizione > 0 ? t("posizione")(posizione) : "");
  const g = grado(S.livello - S.livelloPartenza + 1);
  $("fnGrado").innerHTML = `<small>${t("gradoTitolo")}</small><span class="gEm">${g[1]}</span><span class="gTit">${g[2]}</span><span class="gNota">${g[3]}</span>`;
  mostraClassifica($("classificaFine"), classifica);
  $("schermoFine").querySelector(".scheda").scrollTop = 0;
  $("schermoFine").hidden = false; $("bRigioca").focus({ preventScroll: true });
}

// ===================== volo =====================
function invia() {
  if (S.fase !== "fermo" || !S.comandi.length) return;
  S.fase = "volo"; messaggio("", "");
  const passi = [];
  for (const c of S.comandi) for (let i = 0; i < c.n; i++) passi.push(c.d);
  let { x, y } = S.ape, i = 0, bordo = false;
  const passo = () => {
    if (S.fase !== "volo") return;              // volo interrotto (albero scaduto)
    if (i >= passi.length) { atterra(x, y, bordo); return; }
    const [dx, dy] = DIR[passi[i++]];
    const nx = Math.min(S.N - 1, Math.max(0, x + dx)), ny = Math.min(S.N - 1, Math.max(0, y + dy));
    if (nx !== x + dx || ny !== y + dy) bordo = true;   // ha sbattuto contro il bordo del prato
    x = nx; y = ny;
    S.ape = { x, y }; pos(apeEl, x, y);
    if (S.fiore && S.fiore.x === x && S.fiore.y === y) {
      S.fiore = null; S.punti += CONFIG.fiore.punti;
      if (S.vite < CONFIG.viteMax) S.vite++;
      aggiornaStato(); messaggio(`${t("fiore")}${CONFIG.fiore.punti}`, "bene");
      const f = el.griglia.querySelector(".fiore"); if (f) f.remove();
    }
    setTimeout(passo, CONFIG.msPerCella);
  };
  setTimeout(passo, 120);
}
function atterra(x, y, bordo) {
  if (S.fase !== "volo") return;
  const albero = S.alberi.find(a => a.x === x && a.y === y);
  if (albero) { successo(albero); return; }
  // errore: l'ape resta ferma sulla casella sbagliata (evidenziata) e il codice resta scritto, da correggere
  S.fase = "errore";
  el.griglia.insertBefore(ent("errore", "", x, y), apeEl);
  if (S.ragnatele.some(r => r.x === x && r.y === y)) { if (!perdiVita(t("ragnatela"))) return; }
  else messaggio(bordo ? t("bordo") : t("noMiele"), "male");
  setTimeout(() => {
    if (S.fase !== "errore") return;             // nel frattempo l'albero è scaduto o il gioco è finito
    S.fase = "fermo"; S.ape = { ...S.alveare }; disegna(); messaggio(t("correggi"), "male");
  }, 1500);
}

// ===================== tastiera =====================
function aggiungi(d) {
  if (S.fase !== "fermo") return;
  const u = S.comandi[S.comandi.length - 1];
  if (u && u.d === d && u.n < 9) u.n++; else S.comandi.push({ d, n: 1 });
  disegnaCodice();
}
function cancella() { if (S.fase !== "fermo") return; const u = S.comandi[S.comandi.length - 1]; if (!u) return; if (u.n > 1) u.n--; else S.comandi.pop(); disegnaCodice(); }
el.pad.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => aggiungi(b.dataset.d)));
$("bCanc").addEventListener("click", cancella);
$("bSvuota").addEventListener("click", () => { if (S.fase !== "fermo") return; S.comandi = []; disegnaCodice(); });
$("bInvia").addEventListener("click", invia);
document.addEventListener("keydown", e => {
  if (el.pad.hidden || e.target.tagName === "INPUT") return;
  const k = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R" }[e.key];
  if (k) { e.preventDefault(); aggiungi(k); }
  else if (e.key === "Enter") { e.preventDefault(); invia(); }
  else if (e.key === "Backspace") { e.preventDefault(); cancella(); }
});

// ===================== classifica (solo su questo dispositivo) =====================
const chiave = () => "apeCoder.classifica." + S.diff;
function leggiClassifica() { try { return JSON.parse(localStorage.getItem(chiave())) || []; } catch (e) { return []; } }
function salvaPunteggio(nome, punti, livello, partenza) {
  const lista = leggiClassifica().map(r => ({ ...r, io: false }));
  lista.push({ nome, punti, livello, partenza, io: true });
  lista.sort((a, b) => b.punti - a.punti);
  const top = lista.slice(0, CONFIG.classificaMax);
  try { localStorage.setItem(chiave(), JSON.stringify(top.map(({ nome, punti, livello, partenza }) => ({ nome, punti, livello, partenza })))); } catch (e) {}
  return top;
}
function grado(lv) { const g = t("gradi"); let r = g[0]; for (const x of g) if (lv >= x[0]) r = x; return r; }
function mostraClassifica(ol, lista) {
  ol.innerHTML = lista.length ? lista.map((r, i) => `<li class="${r.io ? "io" : ""}"><b>${i + 1}.</b><span>${r.nome.replace(/[<>&]/g, "")}</span><span class="pt">${r.punti}</span><span>${grado((r.livello - (r.partenza || 1)) + 1)[1]} ${t("liv").toLowerCase()} ${r.livello}</span></li>`).join("")
    : `<li><span></span><span>${t("nessuno")}</span></li>`;
}

// ===================== avvio =====================
function mostraGioco(v) { [el.stato, el.campo, el.msg, el.codice, el.pad].forEach(e => e.hidden = !v); }
function iniziaPartita() {
  Object.assign(CONFIG, DIFFICOLTA[S.diff]);
  S.livello = Math.max(1, parseInt($("inLivello").value, 10) || 1); S.livelloPartenza = S.livello; S.punti = 0; S.vite = CONFIG.vite; S.serie = 0; S.idAlbero = 0; S.dueAlberiVisto = false;
  mostraGioco(true); costruisciLivello(); messaggio(messaggioLivello(), ""); avviaLoop();
}
$("formInizio").addEventListener("submit", e => {
  e.preventDefault(); S.nome = $("inNome").value.trim().slice(0, 10) || "Ape";
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  $("schermoInizio").hidden = true; iniziaPartita();
});
$("bContinua").addEventListener("click", () => { $("schermoLivello").hidden = true; costruisciLivello(); messaggio(messaggioLivello(), ""); avviaLoop(); });
$("bRigioca").addEventListener("click", () => { $("schermoFine").hidden = true; $("inNome").value = S.nome; classificaIniziale(); $("formInizio").scrollTop = 0; $("schermoInizio").hidden = false; mostraGioco(false); });
window.addEventListener("resize", () => { if (!el.campo.hidden) el.campo.style.setProperty("--cella", `calc(${el.campo.clientWidth}px / ${S.N})`); });
function classificaIniziale() {
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  const lista = leggiClassifica(); $("classificaInizio").innerHTML = "";
  if (lista.length) { const ol = document.createElement("ol"); ol.className = "classifica"; mostraClassifica(ol, lista.slice(0, 5)); $("classificaInizio").appendChild(ol); }
}
document.querySelectorAll('input[name="diff"]').forEach(r => r.addEventListener("change", classificaIniziale));
document.documentElement.lang = L;
document.title = L === "en" ? "Bee Coder" : "Ape Coder";
document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
// ===================== uscita durante la partita =====================
$("bEsci").addEventListener("click", () => {
  if (S.fase === "fine") { location.href = "index.html"; return; }
  S.pausaDa = Date.now(); fermaLoop();
  $("esciTesto").textContent = S.punti === 0 ? t("esciNiente") : t("esciTesto")(S.punti);
  $("bSalvaEsci").textContent = S.punti === 0 ? t("esciSolo") : t("esciSalva");
  $("schermoEsci").hidden = false; $("bResta").focus({ preventScroll: true });
});
$("bResta").addEventListener("click", () => {
  $("schermoEsci").hidden = true;
  const dt = Date.now() - (S.pausaDa || Date.now());
  if (typeof S.scade === "number") S.scade += dt;
  if (Array.isArray(S.alberi)) S.alberi.forEach(a => a.scade += dt);
  if (S.fiore && S.fiore.scade) S.fiore.scade += dt;
  if (!document.querySelector(".velo:not([hidden])")) avviaLoop();
});
$("bSalvaEsci").addEventListener("click", () => { if (S.punti > 0) salvaPunteggio(S.nome, S.punti, S.livello, S.livelloPartenza); location.href = "index.html"; });
classificaIniziale();
</script>
