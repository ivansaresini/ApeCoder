<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scuola Ape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: prato e cielo come nei giochi; titolo, griglia di quadrati 2 colonne (3 su schermi larghi) */
:root{
  --sky:#dcf1fb; --meadow:#9bd56a; --honey:#f6b73c; --honey-d:#c98610; --ink:#3b2a10; --ink-soft:#7a6240;
  --paper:#fffaf0; --sky-d:#2d7fc1; --display:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;min-height:100dvh;display:flex}
main{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.5vw,44px);margin:0;text-align:center;color:var(--honey-d);text-wrap:balance;line-height:1.1}
.sotto{text-align:center;margin:0;color:var(--ink-soft);font-size:14px}
.griglia{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:10px;flex:1;min-height:0}
@media (min-width:640px){.griglia{grid-template-columns:repeat(3,1fr)}}
.gioco{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--paper);border-radius:18px;padding:10px 8px;min-height:0;
  text-decoration:none;color:inherit;text-align:center;box-shadow:0 5px 0 #d9cdb3;transition:transform .1s}
.gioco:active{transform:translateY(3px);box-shadow:0 2px 0 #d9cdb3}
.gioco:focus-visible{outline:3px solid var(--sky-d);outline-offset:3px}
.gioco .em{font-size:clamp(30px,9vw,48px);line-height:1}
.gioco h2{font-family:var(--display);font-weight:700;font-size:clamp(15px,4.6vw,20px);margin:0;line-height:1.15;text-wrap:balance}
.gioco .cosa{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sky-d);font-weight:800}
.gioco .tasto{margin-top:2px;background:var(--honey);border-radius:10px;padding:4px 12px;font-family:var(--display);font-size:14px;box-shadow:0 3px 0 var(--honey-d)}
.gioco.presto{opacity:.72;box-shadow:none;border:2px dashed #d9cdb3;cursor:default}
.gioco.presto .em{filter:grayscale(.6)}
.gioco.presto .tasto{background:#eee4cc;box-shadow:none;color:var(--ink-soft)}
.gioco{font:inherit;border:0;cursor:pointer;width:100%}
.gioco.presto{cursor:pointer;opacity:.85}
.velo{position:fixed;inset:0;background:rgba(40,30,10,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
[hidden]{display:none!important}
.scheda{background:var(--paper);border-radius:22px;padding:22px 20px;width:100%;max-width:440px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.scheda .em{font-size:48px;text-align:center;line-height:1}
.scheda h2{font-family:var(--display);font-size:28px;margin:0;text-align:center;line-height:1.1}
.scheda .cosa{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sky-d);font-weight:800}
.scheda p{margin:0;line-height:1.45;font-size:16px}
.blocco{background:var(--sky);border-radius:14px;padding:12px 14px}
.blocco b{font-family:var(--display);color:var(--sky-d);display:block;margin-bottom:4px}
.codice{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border-radius:8px;padding:4px 8px;display:inline-block;font-size:14px;margin-top:4px}
.azioni{display:flex;gap:10px}
.azioni button,.azioni a{flex:1;font-family:var(--display);font-weight:700;font-size:20px;border:0;border-radius:14px;padding:12px;cursor:pointer;text-decoration:none;text-align:center;color:var(--ink)}
.gioca{background:var(--honey);box-shadow:0 4px 0 var(--honey-d)}
.gioca[aria-disabled="true"]{background:#eee4cc;box-shadow:none;color:var(--ink-soft);pointer-events:none}
.chiudi{background:var(--sky)}
footer{text-align:center;font-size:12px;color:var(--ink-soft)}
@media (max-height:700px){footer{display:none}.sotto{display:none}}
</style>
</head>
<body>
<main>
  <h1>🐝 Scuola Ape</h1>
  <p class="sotto">Impara a programmare giocando con le api. Scegli un gioco!</p>
  <nav class="griglia" aria-label="Giochi">
    <button class="gioco" data-g="ape">
      <span class="em">🍯</span><h2>Ape Coder</h2><span class="cosa">Sequenze</span><span class="tasto">GIOCA</span>
    </button>
    <button class="gioco presto" data-g="danza">
      <span class="em">💃</span><h2>Danza dell'ape</h2><span class="cosa">Cicli</span><span class="tasto">In arrivo</span>
    </button>
    <button class="gioco presto" data-g="guardiana">
      <span class="em">🛡️</span><h2>Guardiana dell'alveare</h2><span class="cosa">Condizioni</span><span class="tasto">In arrivo</span>
    </button>
    <button class="gioco presto" data-g="fabbrica">
      <span class="em">🏭</span><h2>Fabbrica del miele</h2><span class="cosa">Ordine e debug</span><span class="tasto">In arrivo</span>
    </button>
    <button class="gioco presto" data-g="favo">
      <span class="em">⬡</span><h2>Celle esagonali</h2><span class="cosa">Pattern</span><span class="tasto">In arrivo</span>
    </button>
    <button class="gioco presto" data-g="impollinatrice">
      <span class="em">🌸</span><h2>Impollinatrice</h2><span class="cosa">Funzioni</span><span class="tasto">In arrivo</span>
    </button>
  </nav>
  <footer>Progetto scuola sulle api · ogni gioco ha la sua classifica</footer>
</main>
<div class="velo" id="velo" hidden>
  <div class="scheda" role="dialog" aria-modal="true" aria-labelledby="sTitolo">
    <div class="em" id="sEm"></div>
    <h2 id="sTitolo"></h2>
    <div class="cosa" id="sCosa"></div>
    <p id="sGioco"></p>
    <div class="blocco"><b>Cosa impari</b><span id="sImpari"></span></div>
    <div class="blocco"><b>Come nel coding vero</b><span id="sCoding"></span><br><span class="codice" id="sEsempio"></span></div>
    <div class="azioni"><button class="chiudi" id="bChiudi">Indietro</button><a class="gioca" id="bGioca" href="#">GIOCA</a></div>
  </div>
</div>
<script>
const GIOCHI = {
  ape: { em: "🍯", titolo: "Ape Coder", cosa: "Sequenze", link: "ape-coder.html",
    gioco: "Scrivi con le frecce il percorso dall'alveare all'albero col miele, poi premi INVIA e guarda l'ape eseguirlo. Devi fare in fretta: il miele finisce!",
    impari: " Un programma è una lista di istruzioni eseguite una dopo l'altra, nell'ordine esatto in cui le hai scritte. Il computer non indovina: fa solo quello che gli dici. E ci sono tanti modi per arrivare allo stesso posto, ma alcuni sono più corti.",
    coding: " Ogni freccia è un'istruzione, INVIA è il tasto \"esegui\". Un robot aspirapolvere o un videogioco funzionano così.",
    esempio: "destra 3 · su 2 · esegui" },
  danza: { em: "💃", titolo: "Danza dell'ape", cosa: "Cicli", link: "",
    gioco: "I fiori sono disposti in una figura che si ripete. Hai pochi mattoncini: per visitarli tutti devi usare il blocco RIPETI.",
    impari: " Quando un'azione si ripete, non la riscrivi dieci volte: la scrivi una volta e dici quante volte ripeterla. Si chiama ciclo, ed è il trucco con cui i programmi fanno milioni di cose in un secondo.",
    coding: " Il blocco RIPETI è il \"for\" dei linguaggi di programmazione.",
    esempio: "ripeti 4 volte [ destra, destra ]" },
  guardiana: { em: "🛡️", titolo: "Guardiana dell'alveare", cosa: "Condizioni", link: "",
    gioco: "Sei l'ape guardiana. Scrivi le regole di chi può entrare, poi arriva la fila di insetti sempre più veloce: le tue regole faranno passare le amiche e fermeranno le vespe?",
    impari: " Un programma può decidere: SE succede una cosa ALLORA fai questo, ALTRIMENTI fai quest'altro. Le regole vanno scritte prima e devono coprire tutti i casi, anche quelli strani.",
    coding: " Il SE / ALLORA è l'istruzione \"if\". Ogni app che chiede una password funziona così.",
    esempio: "se ha le strisce e le ali trasparenti → entra" },
  fabbrica: { em: "🏭", titolo: "Fabbrica del miele", cosa: "Ordine e debug", link: "",
    gioco: "Le fasi per fare il miele arrivano mischiate: rimettile in ordine trascinandole. Nei livelli alti c'è una fase sbagliata da scovare e togliere.",
    impari: " L'ordine conta: se metti il tetto prima dei muri la casa crolla. E quando un programma non funziona, cercare l'errore si chiama debug: è il lavoro più importante di chi programma.",
    coding: " Un \"bug\" è un errore nel codice. Trovarlo e toglierlo è ciò che i programmatori fanno ogni giorno.",
    esempio: "1. raccogli nettare → 2. ... → 5. chiudi con la cera" },
  favo: { em: "⬡", titolo: "Celle esagonali", cosa: "Pattern", link: "",
    gioco: "Il favo ha celle colorate che seguono una regola. Scopri la regola e completa le celle mancanti prima che il tempo scada.",
    impari: " Riconoscere uno schema che si ripete è il primo passo per scrivere un programma corto: invece di descrivere ogni cella, descrivi la regola.",
    coding: " Trovare il pattern e scriverlo come regola si chiama astrazione. Anche il computer disegna così le trame e i colori.",
    esempio: "giallo, giallo, nero · ripeti" },
  impollinatrice: { em: "🌸", titolo: "Impollinatrice", cosa: "Funzioni", link: "",
    gioco: "Insegna all'ape una mossa (per esempio \"vai al fiore e torna\") e dalle un nome. Poi richiamala con un tasto solo, tutte le volte che vuoi.",
    impari: " Una funzione è un pezzo di programma con un nome: lo scrivi una volta e lo usi ovunque. Così i programmi grandi restano ordinati e si capiscono.",
    coding: " Le funzioni sono i mattoni di ogni app: \"salva\", \"invia\", \"stampa\" sono funzioni.",
    esempio: "definisci raccogli = [ su 2, destra 1, giù 2 ] · raccogli · raccogli" },
};
const $ = id => document.getElementById(id);
let ultimo = null;
function apri(k) {
  const g = GIOCHI[k]; ultimo = document.activeElement;
  $("sEm").textContent = g.em; $("sTitolo").textContent = g.titolo; $("sCosa").textContent = g.cosa;
  $("sGioco").textContent = g.gioco; $("sImpari").textContent = g.impari; $("sCoding").textContent = g.coding; $("sEsempio").textContent = g.esempio;
  const b = $("bGioca"); b.href = g.link || "#"; b.textContent = g.link ? "GIOCA" : "In arrivo"; b.setAttribute("aria-disabled", g.link ? "false" : "true");
  $("velo").hidden = false; $("bChiudi").focus();
}
function chiudi() { $("velo").hidden = true; if (ultimo) ultimo.focus(); }
document.querySelectorAll(".gioco").forEach(b => b.addEventListener("click", () => apri(b.dataset.g)));
$("bChiudi").addEventListener("click", chiudi);
$("velo").addEventListener("click", e => { if (e.target === $("velo")) chiudi(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("velo").hidden) chiudi(); });
</script>
</body>
</html>
