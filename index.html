<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scuola Ape</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:600 800;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
/* Layout: prato e cielo come nei giochi; titolo con info e lingua, griglia di quadrati 2 colonne (3 su schermi larghi) che riempie lo schermo */
:root{
  --sky:#dcf1fb; --meadow:#9bd56a; --honey:#f6b73c; --honey-d:#c98610; --ink:#3b2a10; --ink-soft:#7a6240;
  --paper:#fffaf0; --sky-d:#2d7fc1;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;min-height:100dvh;display:flex}
main{max-width:720px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.testa{display:grid;grid-template-columns:44px 44px minmax(0,1fr) 44px 44px;grid-template-areas:"lingua . h1 coppa info";gap:8px;align-items:center}
.testa h1{grid-area:h1;min-width:0}
.tondo{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);cursor:pointer;box-shadow:0 3px 0 #d9cdb3;font-size:22px;line-height:1;display:grid;place-items:center}
.tondo:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
.info{grid-area:info;color:var(--sky-d);font-family:Georgia,serif;font-style:italic;font-weight:700}
.lingua{grid-area:lingua}
.coppa{grid-area:coppa;font-size:20px}
.info,.lingua,.coppa{position:static;transform:none}
@media (max-width:520px){.testa{grid-template-columns:44px 1fr 44px 44px;grid-template-areas:"lingua . coppa info" "h1 h1 h1 h1";row-gap:4px}.testa h1{font-size:clamp(26px,7.5vw,32px)}}
.coppaLista{display:flex;flex-direction:column;gap:12px;text-align:left}
.coppaLista h3{font-family:var(--display);margin:0;font-size:18px;display:flex;align-items:center;gap:6px;position:sticky;top:0;background:var(--paper);padding:4px 0}
.coppaLista ol{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.coppaLista li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"n nome pt" "n diff pt";column-gap:6px;row-gap:0;align-items:center;padding:4px 8px;border-radius:8px;background:var(--sky);font-size:15px}
.coppaLista li b{grid-area:n}
.coppaLista li > span:nth-child(2){grid-area:nome;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coppaLista li .pt{grid-area:pt;font-family:var(--display);font-size:17px}
.coppaLista li small{grid-area:diff;color:var(--ink-soft);font-size:12px;line-height:1.2}
#schedaCoppa .azioni{position:sticky;bottom:0;background:var(--paper);padding-top:8px;margin-bottom:-22px;padding-bottom:22px}
.coppaLista .nessuno{color:var(--ink-soft);font-size:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.5vw,44px);margin:0;text-align:center;color:var(--honey-d);text-wrap:balance;line-height:1.1}
.sotto{text-align:center;margin:0;color:var(--ink-soft);font-size:14px}
.griglia{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:10px;flex:1;min-height:0}
@media (min-width:640px){.griglia{grid-template-columns:repeat(3,1fr)}}
.gioco{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--paper);border-radius:18px;padding:10px 8px;min-height:0;
  font:inherit;border:0;cursor:pointer;width:100%;color:inherit;text-align:center;box-shadow:0 5px 0 #d9cdb3;transition:transform .1s}
.gioco:active{transform:translateY(3px);box-shadow:0 2px 0 #d9cdb3}
.gioco:focus-visible{outline:3px solid var(--sky-d);outline-offset:3px}
.gioco .em{font-size:clamp(30px,9vw,48px);line-height:1}
.gioco h2{font-family:var(--display);font-weight:700;font-size:clamp(15px,4.6vw,20px);margin:0;line-height:1.15;text-wrap:balance}
.gioco .cosa{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sky-d);font-weight:800}
.gioco .tasto{margin-top:2px;background:var(--honey);border-radius:10px;padding:4px 12px;font-family:var(--display);font-size:14px;box-shadow:0 3px 0 var(--honey-d)}
.gioco.presto{opacity:.85;box-shadow:none;border:2px dashed #d9cdb3}
.gioco.presto .em{filter:grayscale(.6)}
.gioco.presto .tasto{background:#eee4cc;box-shadow:none;color:var(--ink-soft)}
footer{text-align:center;font-size:12px;color:var(--ink-soft)}
@media (max-height:700px){.sotto{display:none}}
.velo{position:fixed;inset:0;background:rgba(40,30,10,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
[hidden]{display:none!important}
.scheda{background:var(--paper);border-radius:22px;padding:22px 20px;width:100%;max-width:440px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.scheda .em{font-size:48px;text-align:center;line-height:1}
.scheda h2{font-family:var(--display);font-size:28px;margin:0;text-align:center;line-height:1.1}
.scheda .cosa{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sky-d);font-weight:800}
.scheda p{margin:0;line-height:1.45;font-size:16px}
.scheda a{color:var(--sky-d)}
.blocco{background:var(--sky);border-radius:14px;padding:12px 14px}
.blocco b{font-family:var(--display);color:var(--sky-d);display:block;margin-bottom:4px}
.blocco.giallo{background:#fde9a8;border:2px solid var(--honey)}
.blocco.giallo b{color:var(--honey-d)}
.codice{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border-radius:8px;padding:4px 8px;display:inline-block;font-size:14px;margin-top:4px}
.azioni{display:flex;gap:10px}
.azioni button,.azioni a{flex:1;font-family:var(--display);font-weight:700;font-size:20px;border:0;border-radius:14px;padding:12px;cursor:pointer;text-decoration:none;text-align:center;color:var(--ink)}
.gioca{background:var(--honey);box-shadow:0 4px 0 var(--honey-d)}
.gioca[aria-disabled="true"]{background:#eee4cc;box-shadow:none;color:var(--ink-soft);pointer-events:none}
.chiudi{background:var(--sky)}
.tab{display:flex;flex-wrap:wrap;gap:6px;background:var(--sky);border-radius:14px;padding:4px}
.tab button{flex:1 1 auto;min-width:0;min-height:44px;border:0;border-radius:11px;padding:8px 6px;font-family:var(--display);font-weight:700;font-size:clamp(12px,3.6vw,14px);background:transparent;color:var(--ink-soft);cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:4px}
@media (max-width:520px){.tab{display:grid;grid-template-columns:1fr 1fr}}
.tab button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 #d9cdb3}
.tab button:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
.pannello{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>

  </div>
</div>

  try { const s = localStorage.getItem(CHIAVE_LINGUA); if (s === "it" || s === "en") return s; } catch (e) {}
  return (navigator.language || "it").toLowerCase().startsWith("en") ? "en" : "it";
}
function salvaLingua(l) { try { localStorage.setItem(CHIAVE_LINGUA, l); } catch (e) {} }
let L = leggiLingua();

    giocoT: "Come si gioca", impariT: "Cosa impari", codingT: "Come nel coding vero",

    info1b: "Una lista di istruzioni in ordine, che risolve un problema, si chiama algoritmo. Anche la ricetta della torta è un algoritmo!",
    info2t: "Per i grandi: perché impararlo da piccoli", info2: "Programmare insegna a dividere un problema grande in pezzi piccoli, a provare, sbagliare e correggere senza paura. Serve anche a chi non farà il programmatore: è un modo di pensare.",

    ricTitolo: "Riconoscimenti",
    ric1: "Scuola Ape è nata per un progetto scolastico sulle api. Le curiosità sulle api vengono dall'apicoltura e dalla divulgazione scientifica; i giochi sono originali.",

    privTitolo: "Privacy",

    priv2: "Il sito è ospitato su GitHub Pages: per servire le pagine GitHub può registrare dati tecnici di connessione (come l'indirizzo IP) secondo la privacy policy di GitHub.",

    giocoT: "How to play", impariT: "What you learn", codingT: "In real coding",
