<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Impollinatrice</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:600 800;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
/* Layout: barra stato, griglia, barra tempo, messaggio, due righe di codice (mossa e programma), tastiera */
:root{
  --sky:#dcf1fb; --meadow:#9bd56a; --meadow2:#b4e284; --honey:#f6b73c; --honey-d:#c98610;
  --ink:#3b2a10; --ink-soft:#7a6240; --paper:#fffaf0; --danger:#c0332a; --ok:#2a7527; --sky-d:#2d7fc1;
  --fnA:#8fc9f2; --fnA-d:#2d7fc1; --fnB:#b7e39a; --fnB-d:#3a7d2a;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;height:100dvh}
body{height:100%;height:100dvh;margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
button{font-family:var(--display);font-weight:700;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
[hidden]{display:none!important}

.stato{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--paper);border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:15px}
.stato > div{white-space:nowrap;flex-shrink:0}
.stato .nome{font-family:var(--display);font-size:18px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1}
.stato .vite{letter-spacing:2px;font-size:18px}
.stato .punti{font-family:var(--display);font-size:22px;color:var(--honey-d)}
.stato small{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:480px){.stato{padding:6px 8px;gap:6px}.stato small{display:none}.stato .vite{letter-spacing:0;font-size:16px}.stato .nome{max-width:28%;font-size:16px}.stato .punti{font-size:20px}}

body{--sotto:416px}
body.due-mosse{--sotto:462px}
@media (max-height:700px){.pad{grid-template-rows:repeat(3,48px)} body{--sotto:404px} body.due-mosse{--sotto:450px}}
.campo{position:relative;flex:0 0 auto;width:min(100%,520px,calc(100dvh - var(--sotto) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));aspect-ratio:1;max-width:100%;min-width:160px;
  background:var(--meadow);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 #6fae43}
.griglia{position:absolute;inset:0;display:grid}
.cella{border:1px solid rgba(255,255,255,.28)}
.cella:nth-child(odd){background:var(--meadow2)}
.ent{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1}
.ent .em{font-size:calc(var(--cella) * .62)}
.fiore.preso .em{opacity:.35}
.fiore.preso::after{content:"✔";position:absolute;font-size:calc(var(--cella) * .45);color:var(--ok);font-weight:900}
.ape{transition:left .26s linear,top .26s linear;z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.ape.salto{transition:none}
.alveare svg{width:78%;height:78%}
.partenza::before{content:"";width:70%;height:70%;border:2px dashed #3b2a10;border-radius:6px;opacity:.5}
@media (prefers-reduced-motion:reduce){.ape{transition-duration:.05s}}

.tempo{width:100%;max-width:520px;height:12px;background:var(--paper);border-radius:999px;overflow:hidden;position:relative}
.tempo i{position:absolute;inset:0;background:var(--honey);transform-origin:left;transition:transform .1s linear,background .2s}
.tempo.urgente i{background:var(--danger)}
.msg{height:36px;line-height:18px;font-size:clamp(13px,3.9vw,15px);color:var(--ink-soft);text-align:center;width:100%;max-width:520px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.bene{color:var(--ok)}.msg.male{color:var(--danger)}
.codice{width:100%;max-width:520px;display:flex;flex-direction:column;gap:4px}
.riga{min-height:42px;max-height:66px;overflow-y:auto;background:var(--paper);border-radius:12px;padding:4px 8px;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:5px;font-family:var(--display);font-size:17px;border:3px solid transparent}
.riga.attiva{border-color:var(--honey-d);background:#fff3d1}
.riga .etich{font-size:11px;font-family:var(--body);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.riga[data-r="A"],.riga[data-r="B"]{max-height:42px;overflow:hidden}
.riga[data-r="A"] .chip,.riga[data-r="B"] .chip,.esempio .riga .chip{font-size:15px;padding:1px 6px;border-radius:8px}
@media (max-width:400px){.riga[data-r="P"] .chip .nm{display:none}}
.riga .vuoto{color:var(--ink-soft);font-size:13px;font-family:var(--body)}
.riga .resto{margin-left:auto;font-size:12px;color:var(--ink-soft);font-family:var(--body);white-space:nowrap}
.riga .resto.zero{color:var(--danger)}
.chip{background:var(--honey);color:var(--ink);border-radius:9px;padding:1px 8px;line-height:1.3}
.chip.fnA{background:var(--fnA);color:#0f3454}.chip.fnB{background:var(--fnB);color:#143d0f}
.chip.nome{background:transparent;padding:0;font-size:15px}
.chip.bloccata{opacity:.75}

.pad{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;grid-template-rows:repeat(3,52px);gap:7px}
.pad button{border-radius:14px;font-size:24px;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 #d9cdb3;padding:0 3px;line-height:1.1}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cdb3}
.pad .canc{grid-column:1;grid-row:1;font-size:22px}
.pad .su{grid-column:2;grid-row:1}
.pad .dove{grid-column:3;grid-row:1;font-size:clamp(11px,3.4vw,14px);background:var(--honey);box-shadow:0 4px 0 var(--honey-d);white-space:normal;line-height:1.1;overflow-wrap:anywhere;hyphens:auto}
.pad .sx{grid-column:1;grid-row:2}.pad .giu{grid-column:2;grid-row:2}.pad .dx{grid-column:3;grid-row:2}
.pad .fnA{grid-column:1;grid-row:3;background:var(--fnA);box-shadow:0 4px 0 var(--fnA-d)}
.pad .fnB{grid-column:2;grid-row:3;background:var(--fnB);box-shadow:0 4px 0 var(--fnB-d)}
.pad .fnA,.pad .fnB{font-size:clamp(12px,3.6vw,17px);white-space:normal;line-height:1.1;overflow-wrap:anywhere}
.pad .aiuto{grid-column:3;grid-row:3;font-family:var(--body);font-size:11px;color:var(--ink-soft);box-shadow:none;background:transparent;font-weight:600;padding:0;line-height:1.15;display:none}
@media (min-width:600px){.pad .aiuto{display:block;font-size:13px}}
.pad .invia{grid-column:4;grid-row:1/4;background:var(--honey);box-shadow:0 4px 0 var(--honey-d);font-size:22px;letter-spacing:.04em}
.pad .invia:active{box-shadow:0 1px 0 var(--honey-d)}
.pad button:disabled{opacity:.4;transform:none;box-shadow:none}
.pad .aiuto:disabled{opacity:1}
@media (min-height:800px){body{gap:8px}.pad{grid-template-rows:repeat(3,54px);gap:8px}.pad button{font-size:26px}.tempo{height:14px}body{--sotto:436px}body.due-mosse{--sotto:482px}}
.pad .fnB[hidden]{display:block!important;visibility:hidden;pointer-events:none}

.velo{position:fixed;inset:0;background:rgba(40,30,10,.55);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:20}
.scheda{position:relative;background:var(--paper);border-radius:22px;padding:22px 20px;width:100%;max-width:420px;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.scheda h1{font-size:34px;color:var(--fnA-d)}
.scheda h2{font-size:30px}
.scheda p{margin:0;line-height:1.45}
.scheda input,.scheda select{font:inherit;font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid var(--honey);text-align:center;width:100%;background:#fff;color:var(--ink)}
.casa{position:absolute;top:8px;left:8px;width:44px;height:44px;display:grid;place-items:center;font-size:24px;text-decoration:none;line-height:1;padding:0;border-radius:12px}
.casa:hover{background:var(--sky)}
.grande{background:var(--honey);color:var(--ink);border-radius:14px;padding:12px 18px;font-size:22px;box-shadow:0 4px 0 var(--honey-d)}
.grande:active{transform:translateY(3px);box-shadow:0 1px 0 var(--honey-d)}
.regole{text-align:left;font-size:15px;display:grid;gap:6px;padding:0;margin:0;list-style:none}
.regole li{display:flex;gap:10px;align-items:center}
.regole .em{font-size:24px;flex:0 0 46px;text-align:center}
.livelli{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.livelli label{position:relative;display:block}
.livelli input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.livelli span{display:block;padding:12px 2px;border-radius:12px;background:var(--sky);font-family:var(--display);font-size:clamp(13px,3.8vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid transparent;min-height:44px}
.livelli input:checked + span{background:var(--honey);border-color:var(--honey-d)}
.livelli input:focus-visible + span{outline:3px solid var(--sky-d);outline-offset:2px}
.partenza{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:17px}
.partenza select{width:auto;font-size:18px;padding:10px 14px;min-height:44px}
.curiosita{background:var(--sky);border-radius:14px;padding:12px;text-align:left}
.curiosita b{font-family:var(--display);color:var(--sky-d)}
.esempio{background:var(--sky);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.esempio .riga{width:100%;justify-content:center;border:0;background:var(--paper)}
.classifica{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.classifica li{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;padding:4px 8px;border-radius:8px;font-size:16px}
.classifica li.io{background:var(--honey)}
.classifica li span:last-child{color:var(--ink-soft);font-size:13px}
.classifica .pt{font-family:var(--display);font-size:18px}
.esito{font-family:var(--display);font-size:52px;color:var(--honey-d);line-height:1}
@media (max-height:720px){.scheda{padding:16px 16px;gap:10px}.scheda h1{font-size:30px}.scheda p{font-size:15px;line-height:1.35}.regole{gap:4px;font-size:14px}.regole .em{font-size:20px;flex-basis:36px}#formInizio .regole{display:none}#classificaInizio .classifica li{padding:2px 8px;font-size:14px}}
@media (max-width:400px){body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}}
.stato .esci{flex:0 0 auto;width:36px;height:36px;margin:-4px 0 -4px -6px;padding:0;display:grid;place-items:center;font-size:20px;background:transparent;border-radius:10px;line-height:1;box-shadow:none}
.azioni2{display:flex;gap:10px}
.azioni2 button{flex:1;border-radius:14px;padding:12px 8px;font-size:18px;color:var(--ink)}
.azioni2 .salva{background:var(--honey);box-shadow:0 4px 0 var(--honey-d)}
.azioni2 .resta{background:var(--sky)}
.stato .esci{position:relative}
.stato .esci::before{content:"";position:absolute;inset:-6px}
.azioni2 button{line-height:1.2;font-size:clamp(16px,4.6vw,18px)}
@media (max-width:400px){.azioni2{flex-direction:column}}
@media (max-height:720px){.grado{padding:8px 10px;gap:2px}.grado .gEm{font-size:36px}.grado .gTit{font-size:19px}.grado .gNota{font-size:13px;line-height:1.3}#classificaFine li{padding:2px 8px;font-size:14px}}
#schermoFine .grande{position:sticky;bottom:0;box-shadow:0 4px 0 var(--honey-d),0 -10px 10px var(--paper)}
.stato .esci:active{background:var(--sky)}
.grado{background:var(--sky);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.grado .gEm{font-size:44px;line-height:1}
.grado .gTit{font-family:var(--display);font-size:22px;color:var(--sky-d)}
.grado .gNota{font-size:14px;line-height:1.4}
.grado small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
</style>
</head>
<body>

<div class="stato" id="stato" hidden>
  <button class="esci" id="bEsci" aria-label="Menu">🏠</button>
  <div class="nome" id="sNome">—</div>
  <div><small id="sDiff"></small> <b id="sLivello">1</b></div>
  <div class="vite" id="sVite"></div>
  <div class="punti" id="sPunti">0</div>
</div>
<div class="campo" id="campo" hidden><div class="griglia" id="griglia"></div></div>
<div class="tempo" id="tempo" hidden><i id="tempoBarra"></i></div>
<div class="msg" id="msg" hidden></div>
<div class="codice" id="codice" hidden>
  <div class="riga" id="rigaA" data-r="A"></div>
  <div class="riga" id="rigaB" data-r="B" hidden></div>
  <div class="riga" id="rigaP" data-r="P"></div>
</div>
<div class="pad" id="pad" hidden>
  <button class="canc" id="bCanc" aria-label="Cancella">✕</button>
  <button class="su" data-d="U" aria-label="Su">▲</button>
  <button class="dove" id="bDove"></button>
  <button class="sx" data-d="L" aria-label="Sinistra">◀</button>
  <button class="giu" data-d="D" aria-label="Giù">▼</button>
  <button class="dx" data-d="R" aria-label="Destra">▶</button>
  <button class="fnA" id="bFnA"></button>
  <button class="fnB" id="bFnB" hidden></button>
  <button class="aiuto" id="bAiuto" disabled data-t="aiuto"></button>
  <button class="invia" id="bInvia" data-t="invia"></button>
</div>

<div class="velo" id="schermoInizio">
  <form class="scheda" id="formInizio">
    <a class="casa" href="index.html" aria-label="Menu">🏠</a>
    <h1 data-t="titolo"></h1>
    <p data-t="intro"></p>
    <ul class="regole">
      <li><span class="em">🌸</span><span data-t="r1"></span></li>
      <li><span class="em">📘</span><span data-t="r2"></span></li>
      <li><span class="em">🧱</span><span data-t="r3"></span></li>
      <li><span class="em">⏳</span><span data-t="r4"></span></li>
    </ul>
    <input id="inNome" maxlength="10" data-ph="nome" autocomplete="off" required>
    <div class="livelli" role="radiogroup">
      <label><input type="radio" name="diff" value="facile" checked><span data-t="facile"></span></label>
      <label><input type="radio" name="diff" value="medio"><span data-t="medio"></span></label>
      <label><input type="radio" name="diff" value="difficile"><span data-t="difficile"></span></label>
      <label><input type="radio" name="diff" value="senzafretta"><span data-t="senzafretta"></span></label>
    </div>
    <label class="partenza"><span data-t="partiDa"></span> <select id="inLivello"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></label>
    <button class="grande" type="submit" data-t="gioca"></button>
    <div id="classificaInizio"></div>
  </form>
</div>

<div class="velo" id="schermoLivello" hidden>
  <div class="scheda">
    <div class="esito">🎉</div>
    <h2 id="lvTitolo"></h2>
    <p id="lvTesto"></p>
    <div class="curiosita"><b data-t="sapevi"></b><br><span id="lvCuriosita"></span></div>
    <button class="grande" id="bContinua" data-t="continua"></button>
  </div>
</div>

<div class="velo" id="schermoTutorial" hidden>
  <div class="scheda">
    <div class="esito" id="tuEm"></div>
    <h2 id="tuTitolo"></h2>
    <p id="tuTesto"></p>
    <div class="esempio" id="tuEsempio"></div>
    <p id="tuNota"></p>
    <button class="grande" id="bTutorialOk" data-t="capito"></button>
  </div>
</div>

<div class="velo" id="schermoSoluzione" hidden>
  <div class="scheda">
    <div class="esito">💡</div>
    <h2 data-t="solTitolo"></h2>
    <p id="solTesto"></p>
    <div class="esempio" id="solEsempio"></div>
    <button class="grande" id="bSoluzioneOk" data-t="continua"></button>
  </div>
</div>

<div class="velo" id="schermoEsci" hidden>
  <div class="scheda">
    <div class="esito">🏠</div>
    <h2 data-t="esciTitolo"></h2>
    <p id="esciTesto"></p>
    <div class="azioni2"><button class="resta" id="bResta" data-t="esciContinua"></button><button class="salva" id="bSalvaEsci" data-t="esciSalva"></button></div>
  </div>
</div>

<div class="velo" id="schermoFine" hidden>
  <div class="scheda">
    <div class="esito">🌸</div>
    <h2 data-t="fine"></h2>
    <p id="fnTesto"></p>
    <div class="grado" id="fnGrado"></div>
    <ol class="classifica" id="classificaFine"></ol>
    <button class="grande" id="bRigioca" data-t="rigioca"></button>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const CONFIG = {
  vite: 3, viteMax: 5, vitaOgniLivelli: 3,
  tempoLivello: 45, riduzionePerLivello: 0.05, tempoMin: 15,
  msPerCella: 260, passiMax: 120,
  punti: { perFiore: 30, bonusVelocita: 150, bonusCorto: 100, serieStep: 0.10, serieMax: 0.5 },
  soglie: [600, 1400, 2400, 3600, 5000, 6600, 8400, 10400, 12600, 15000],
  classificaMax: 10,
};
const DIFFICOLTA = {
  facile:      { tempoLivello: 70, riduzionePerLivello: 0.03, tempoMin: 25, msPerCella: 300, vite: 5, slack: 2 },
  medio:       { tempoLivello: 50, riduzionePerLivello: 0.05, tempoMin: 18, msPerCella: 260, vite: 4, slack: 1 },
  difficile:   { tempoLivello: 35, riduzionePerLivello: 0.07, tempoMin: 12, msPerCella: 240, vite: 3, slack: 1 },
  senzafretta: { tempoLivello: 70, riduzionePerLivello: 0.03, tempoMin: 25, msPerCella: 300, vite: 5, slack: 2, senzaTempo: true },
};
// ===================== lingua =====================
function leggiLingua() { try { const l = localStorage.getItem("scuolaApe.lingua"); if (l === "it" || l === "en") return l; } catch (e) {} return (navigator.language || "it").toLowerCase().startsWith("en") ? "en" : "it"; }
const L = leggiLingua();
const T = {
  it: { titolo: "🌸 Impollinatrice", intro: "I fiori crescono a mazzi tutti uguali. Insegna all'ape una mossa, dalle un nome e richiamala quante volte vuoi!",
    r1: "L'ape deve passare su tutti i fiori. I mazzi di fiori sono tutti uguali.",
    r2: "La MOSSA 📘 è una lista di frecce con un nome. Nel PROGRAMMA la richiami con un tasto solo.",
    r3: "I mattoncini 🧱 sono pochi: a scrivere tutto con le frecce non bastano. Con la mossa invece bastano!",
    r4: "La barra gialla è il tempo. Se finisce, perdi una vita.",
    nome: "Il tuo nome", facile: "🐣 Facile", medio: "🐝 Medio", difficile: "🔥 Difficile", senzafretta: "🐢 Senza fretta", partiDa: "Parti dal livello", gioca: "GIOCA", invia: "ESEGUI",
    mossaA: "raccogli", mossaB: "salta", programma: "programma", mossa: "mossa", scriviA: "✏️ scrivi 📘", scriviB: "✏️ scrivi 📗", scriviProg: "✏️ programma",

const t = k => T[L][k];

const FRECCIA = { U: "▲", D: "▼", L: "◀", R: "▶" };
const SVG_ALVEARE = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="6" width="24" height="7" rx="3.5" fill="#f6b73c"/><rect x="5" y="13" width="30" height="7" rx="3.5" fill="#e9a52c"/><rect x="4" y="20" width="32" height="7" rx="3.5" fill="#f6b73c"/><rect x="6" y="27" width="28" height="7" rx="3.5" fill="#e9a52c"/><circle cx="20" cy="30" r="3" fill="#3b2a10"/></svg>';

// ===================== mosse: ogni mossa è una lista di frecce; i fiori sono nelle celle indicate (relative al punto di partenza) =====================
// avanza: di quante colonne la mossa sposta l'ape (per calcolare quante ripetizioni stanno nella griglia)
// nome: it/en, mostrato nei chip, nei tasti e nella soluzione
const MOSSE = [
  { id: "torre",  nome: { it: "torre", en: "tower" },  passi: ["U", "U", "D", "D", "R"], fiori: [[0, -1], [0, -2]], avanza: 1 },
  { id: "torre2", nome: { it: "torre", en: "tower" },  passi: ["U", "U", "D", "D", "R", "R"], fiori: [[0, -1], [0, -2]], avanza: 2 },
  { id: "gancio", nome: { it: "gancio", en: "hook" },  passi: ["U", "R", "D", "R"], fiori: [[0, -1], [1, -1]], avanza: 2 },
  { id: "mazzo",  nome: { it: "mazzo", en: "bunch" },  passi: ["U", "U", "R", "D", "D", "R"], fiori: [[0, -2], [1, -2], [1, -1]], avanza: 2 },
  { id: "tetto",  nome: { it: "tetto", en: "roof" },   passi: ["U", "U", "R", "R", "D", "D"], fiori: [[0, -2], [1, -2], [2, -2]], avanza: 2 },
  { id: "salto",  nome: { it: "salto", en: "hop" },    passi: ["R", "R"], fiori: [[1, 0]], avanza: 2 },
];
// nome della mossa del prato corrente (fallback: T.mossaA / T.mossaB)
const nomeMossa = (fn, p) => { const m = (p || S.prato) && (p || S.prato)[fn]; return m ? m.nome[L] : t(fn === "A" ? "mossaA" : "mossaB"); };
function generaPrato(lv) {
  const N = Math.min(10, 6 + Math.floor((lv - 1) / 2)), h = { x: 0, y: N - 1 };
  const due = lv >= 7;
  const facili = MOSSE.filter(m => m.passi.length <= (lv <= 2 ? 5 : 6) && m.id !== "salto");
  const A = facili[Math.floor(Math.random() * facili.length)];
  const altre = MOSSE.filter(m => m !== A);                       // B sempre diversa da A
  const B = due ? altre[Math.floor(Math.random() * altre.length)] : null;
  // sequenza di mosse: A A A… oppure A B A B…, finché restano nella griglia; partenze = casella da cui parte ogni mossa
  const seq = [], fiori = [], partenze = []; let x = h.x, y = h.y, k = 0;
  while (true) {
    const m = due ? (k % 2 ? B : A) : A;
    if (x + m.avanza > N - 1 && k > 0) break;
    const celleOk = m.fiori.every(([dx, dy]) => x + dx >= 0 && x + dx < N && y + dy >= 0 && y + dy < N);
    if (!celleOk || seq.length >= (lv <= 2 ? 3 : lv <= 4 ? 4 : 5)) break;
    seq.push(m === A ? "A" : "B"); partenze.push({ x, y });
    m.fiori.forEach(([dx, dy]) => { if (!fiori.some(f => f.x === x + dx && f.y === y + dy)) fiori.push({ x: x + dx, y: y + dy, preso: false }); });
    x += m.avanza; k++;
  }
  if (seq.length < 2) return generaPrato(lv);
  const ottimo = A.passi.length + (B ? B.passi.length : 0) + seq.length;   // definizioni + chiamate
  return { N, h, A, B, seq, fiori, partenze, ottimo };
}

const S = { nome: "", diff: "facile", livello: 1, punti: 0, vite: 3, serie: 0, base: 0, prato: null, fnA: [], fnB: [], prog: [], dove: "P", budget: 0,
  tentativi: 0, fase: "fermo", loop: null, scade: 0, totale: 0, firma: "", visti: new Set() };
const $ = id => document.getElementById(id);
const el = { stato: $("stato"), campo: $("campo"), griglia: $("griglia"), tempo: $("tempo"), msg: $("msg"), codice: $("codice"), pad: $("pad") };
const tempoLivello = lv => Math.max(CONFIG.tempoMin, CONFIG.tempoLivello * Math.pow(1 - CONFIG.riduzionePerLivello, lv - 1));
const sogliaLivello = lv => CONFIG.soglie[Math.min(lv, CONFIG.soglie.length) - 1] + Math.max(0, lv - CONFIG.soglie.length) * 3000;
const mossaBloccata = () => S.livello === 1;       // al livello 1 la mossa è già scritta
const dueMosse = () => S.livello >= 7;

function nuovoPrato() {
  let p, firma, tent = 0;
  do { p = generaPrato(S.livello); firma = p.fiori.map(f => f.x + "," + f.y).join(";"); } while (firma === S.firma && ++tent < 20);

  S.fnA = mossaBloccata() ? [...p.A.passi] : []; S.fnB = []; S.prog = []; S.dove = "P"; S.tentativi = 0; S.fase = "fermo";
  S.budget = p.ottimo + CONFIG.slack;

  el.tempo.hidden = !!CONFIG.senzaTempo;

  $("rigaB").hidden = !dueMosse(); $("bFnB").hidden = !dueMosse();
  el.griglia.style.gridTemplateColumns = `repeat(${p.N},1fr)`; el.griglia.style.gridTemplateRows = `repeat(${p.N},1fr)`;
  el.campo.style.setProperty("--cella", `calc(${el.campo.clientWidth}px / ${p.N})`);

}

function pos(e, x, y) { const p = 100 / S.N; e.style.left = x * p + "%"; e.style.top = y * p + "%"; e.style.width = p + "%"; e.style.height = p + "%"; }
function ent(cls, html, x, y) { const e = document.createElement("div"); e.className = "ent " + cls; e.innerHTML = html; pos(e, x, y); return e; }
let apeEl = null;

  el.griglia.appendChild(ent("alveare", SVG_ALVEARE, S.alveare.x, S.alveare.y));
  // livelli 2-6 (mossa da scrivere, una sola): quadratino tratteggiato dove parte ogni mazzo (non sull'alveare)
  if (!mossaBloccata() && !dueMosse()) (S.prato.partenze || []).forEach(q => { if (q.x !== S.alveare.x || q.y !== S.alveare.y) el.griglia.appendChild(ent("partenza", "", q.x, q.y)); });

}
function aggiornaStato() {

const costo = () => S.fnA.length + S.fnB.length + S.prog.length;
function chipProg(c, p) { return c.fn ? `<span class="chip fn${c.fn}">${c.fn === "A" ? "📘" : "📗"} <span class="nm">${nomeMossa(c.fn, p)}</span></span>` : `<span class="chip">${FRECCIA[c.d]}</span>`; }

  $("bDove").disabled = mossaBloccata() || S.fase !== "fermo";

}

// ===================== tempo =====================
function tick() {
  if (S.fase !== "fermo" || CONFIG.senzaTempo) return;
  const resto = S.scade - Date.now();
  $("tempoBarra").style.transform = `scaleX(${Math.max(0, resto / S.totale)})`;
  el.tempo.classList.toggle("urgente", resto < 5000);

}
function avviaLoop() { fermaLoop(); S.loop = setInterval(tick, 100); }

function perdiVita(testo) {
  S.vite--; S.serie = 0; aggiornaStato(); messaggio(testo, "male");

}
function esempioHtml(p) {

  return fn("A", p.A, "📘") + (p.B ? fn("B", p.B, "📗") : "") + `<div class="riga"><span class="etich">${t("programma")}</span>${p.seq.map(k => chipProg({ fn: k }, p)).join("")}</div>`;
}

function successo() {
  const rimasto = CONFIG.senzaTempo ? S.totale : Math.max(0, S.scade - Date.now());
  const bonus = Math.round(CONFIG.punti.bonusVelocita * rimasto / S.totale);
  const corto = costo() <= S.prato.ottimo ? CONFIG.punti.bonusCorto : 0;
  const molt = 1 + Math.min(CONFIG.punti.serieMax, S.serie * CONFIG.punti.serieStep);
  const guadagno = Math.round((CONFIG.punti.perFiore * S.prato.fiori.length + bonus + corto) * molt);
  S.punti += guadagno; S.serie++; S.fase = "ok"; aggiornaStato();
  messaggio(`${t("bravo")} +${guadagno}` + (corto ? t("corto") : "") + (S.serie > 1 ? `${t("serie")}${S.serie}` : ""), "bene");
  if (S.base + S.punti >= sogliaLivello(S.livello)) { setTimeout(salitaLivello, 900); return; }

  let extra = "";
  if ((S.livello - 1) % CONFIG.vitaOgniLivelli === 0 && S.vite < CONFIG.viteMax) { S.vite++; extra = t("vitaExtra"); }
  $("lvTitolo").textContent = `${t("livello")} ${S.livello}!`;
  $("lvTesto").textContent = (CONFIG.senzaTempo ? t("lvTestoSenzaTempo")(S.punti) : t("lvTesto")(S.punti, Math.round(tempoLivello(S.livello)))) + extra;
  $("lvCuriosita").textContent = t("curiosita")[(S.livello - 2) % t("curiosita").length];
  $("schermoLivello").querySelector(".scheda").scrollTop = 0; $("schermoLivello").hidden = false; $("bContinua").focus({ preventScroll: true });
}
function fineGioco() {
  fermaLoop(); S.fase = "fine";
  const classifica = salvaPunteggio(S.nome, S.punti, S.livello, S.livelloPartenza);
  const posizione = classifica.findIndex(r => r.io) + 1;
  $("fnTesto").textContent = t("fnTesto")(S.nome, S.punti, t("diffNomi")[S.diff], S.livello) + (posizione > 0 ? t("posizione")(posizione) : "");
  const g = grado(S.livello - S.livelloPartenza + 1);
  $("fnGrado").innerHTML = `<small>${t("gradoTitolo")}</small><span class="gEm">${g[1]}</span><span class="gTit">${g[2]}</span><span class="gNota">${g[3]}</span>`;
  mostraClassifica($("classificaFine"), classifica);
  $("schermoFine").querySelector(".scheda").scrollTop = 0; $("schermoFine").hidden = false; $("bRigioca").focus({ preventScroll: true });
}

// ===================== volo =====================
function invia() {
  if (S.fase !== "fermo") return;
  if (!S.prog.length) { messaggio(t("vuotoProg"), "male"); return; }
  if ((S.prog.some(c => c.fn === "A") && !S.fnA.length) || (S.prog.some(c => c.fn === "B") && !S.fnB.length)) { messaggio(t("vuotaMossa"), "male"); return; }
  S.fase = "volo"; S.tentativi++; messaggio("", ""); disegnaCodice();
  const passi = [];
  for (const c of S.prog) { const lista = c.fn ? (c.fn === "A" ? S.fnA : S.fnB) : [c.d]; for (const d of lista) if (passi.length < CONFIG.passiMax) passi.push(d); }
  let { x, y } = S.alveare, i = 0;
  S.prato.fiori.forEach(f => f.preso = false);
  el.griglia.querySelectorAll(".fiore").forEach(e => e.classList.remove("preso"));
  S.ape = { x, y }; pos(apeEl, x, y);
  const passo = () => {
    if (S.fase !== "volo") return;
    if (i >= passi.length) { atterra(); return; }
    const [dx, dy] = DIR[passi[i++]];
    x = Math.min(S.N - 1, Math.max(0, x + dx)); y = Math.min(S.N - 1, Math.max(0, y + dy));
    S.ape = { x, y }; pos(apeEl, x, y);
    S.prato.fiori.forEach((f, k) => { if (!f.preso && f.x === x && f.y === y) { f.preso = true; const e = el.griglia.querySelector(`.fiore[data-i="${k}"]`); if (e) e.classList.add("preso"); } });
    setTimeout(passo, CONFIG.msPerCella);
  };
  setTimeout(passo, 150);
}
function atterra() {
  if (S.fase !== "volo") return;
  const presi = S.prato.fiori.filter(f => f.preso).length;
  if (presi === S.prato.fiori.length) { successo(); return; }
  S.fase = "fermo"; S.scade += 10000; S.totale += 10000;
  messaggio(t("parziale")(presi, S.prato.fiori.length), "male");
  setTimeout(() => { if (S.fase !== "fermo") return; S.ape = { ...S.alveare }; S.prato.fiori.forEach(f => f.preso = false); disegna(); }, 800);
}

// ===================== editor =====================
function listaAttiva() { return S.dove === "P" ? S.prog : S.dove === "A" ? S.fnA : S.fnB; }
function aggiungi(d) {
  if (S.fase !== "fermo") return;
  if (S.dove !== "P" && mossaBloccata()) return;
  if (S.budget - costo() <= 0) { messaggio(t("tropp"), "male"); return; }
  if (S.dove === "P") S.prog.push({ d }); else listaAttiva().push(d);
  disegnaCodice();
}
function chiama(fn) {
  if (S.fase !== "fermo" || S.dove !== "P") return;
  if (S.budget - costo() <= 0) { messaggio(t("tropp"), "male"); return; }
  S.prog.push({ fn }); disegnaCodice();
}
function cambiaDove() {
  if (S.fase !== "fermo" || mossaBloccata()) return;
  S.dove = S.dove === "P" ? "A" : (S.dove === "A" && dueMosse()) ? "B" : "P";
  disegnaCodice(); messaggio(t("aiuto"), "");
}
function cancella() { if (S.fase !== "fermo") return; if (S.dove !== "P" && mossaBloccata()) return; listaAttiva().pop(); disegnaCodice(); }
el.pad.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => aggiungi(b.dataset.d)));
$("bFnA").addEventListener("click", () => chiama("A")); $("bFnB").addEventListener("click", () => chiama("B"));
$("bDove").addEventListener("click", cambiaDove); $("bCanc").addEventListener("click", cancella); $("bInvia").addEventListener("click", invia);
document.querySelectorAll(".riga").forEach(r => r.addEventListener("click", () => { if (S.fase !== "fermo" || mossaBloccata() && r.dataset.r !== "P") return; S.dove = r.dataset.r; disegnaCodice(); }));
document.addEventListener("keydown", e => {
  if (el.pad.hidden || document.querySelector(".velo:not([hidden])") || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R" }[e.key];
  if (k) { e.preventDefault(); aggiungi(k); }
  else if (e.key === "Enter") { e.preventDefault(); invia(); }
  else if (e.key === "Backspace") { e.preventDefault(); cancella(); }
  else if (e.key === "a") chiama("A"); else if (e.key === "b") chiama("B"); else if (e.key === "Tab") { e.preventDefault(); cambiaDove(); }
});

// ===================== classifica =====================
const chiave = () => "impollinatrice.classifica." + S.diff;
function leggiClassifica() { try { return JSON.parse(localStorage.getItem(chiave())) || []; } catch (e) { return []; } }
function salvaPunteggio(nome, punti, livello, partenza) {
  const lista = leggiClassifica().map(r => ({ ...r, io: false }));
  lista.push({ nome, punti, livello, partenza, io: true });
  lista.sort((a, b) => b.punti - a.punti);
  const top = lista.slice(0, CONFIG.classificaMax);
  try { localStorage.setItem(chiave(), JSON.stringify(top.map(({ nome, punti, livello, partenza }) => ({ nome, punti, livello, partenza })))); } catch (e) {}
  return top;
}
function grado(lv) { const g = t("gradi"); let r = g[0]; for (const x of g) if (lv >= x[0]) r = x; return r; }
function mostraClassifica(ol, lista) {
  ol.innerHTML = lista.length ? lista.map((r, i) => `<li class="${r.io ? "io" : ""}"><b>${i + 1}.</b><span>${r.nome.replace(/[<>&]/g, "")}</span><span class="pt">${r.punti}</span><span>${grado((r.livello - (r.partenza || 1)) + 1)[1]} ${t("liv").toLowerCase()} ${r.livello}</span></li>`).join("")
    : `<li><span></span><span>${t("nessuno")}</span></li>`;
}

// ===================== tutorial e avvio =====================
const ESEMPI = {
  1: { A: MOSSE[0], B: null, seq: ["A", "A", "A"] },
  2: { A: MOSSE[2], B: null, seq: ["A", "A", "A"] },
  7: { A: MOSSE[0], B: MOSSE[5], seq: ["A", "B", "A", "B"] },
};
// l'esempio e i nomi usano il prato corrente (già disegnato dietro la scheda), così corrispondono a ciò che il bambino vede
function esempioTutorial(lv) {
  const p = S.prato; if (!p) return ESEMPI[lv];
  if (lv === 7) return p.B ? p : ESEMPI[7];
  return { A: p.A, B: null, seq: p.B ? ["A", "A", "A"] : p.seq };
}
function mostraTutorial(lv, poi) {
  const tu = t("tutorial")[lv]; if (!tu) { poi(); return; }
  const es = esempioTutorial(lv);
  const testo = typeof tu.testo === "function" ? tu.testo(nomeMossa("A", es), nomeMossa("B", es)) : tu.testo;
  $("tuEm").textContent = tu.em; $("tuTitolo").textContent = tu.titolo; $("tuTesto").textContent = testo; $("tuNota").textContent = tu.nota;
  $("tuEsempio").innerHTML = esempioHtml(es);
  $("schermoTutorial").querySelector(".scheda").scrollTop = 0; $("schermoTutorial").hidden = false; $("bTutorialOk").focus({ preventScroll: true });
  $("bTutorialOk").onclick = () => { $("schermoTutorial").hidden = true; poi(); };
}
function tutorialFinoA(lv, poi) {
  const lista = [1, 2, 7].filter(x => x <= lv && !S.visti.has(x));
  const next = () => { const x = lista.shift(); if (x === undefined) { poi(); return; } S.visti.add(x); mostraTutorial(x, next); };
  next();
}
function mostraGioco(v) { [el.stato, el.campo, el.tempo, el.msg, el.codice, el.pad].forEach(e => e.hidden = !v); if (v && CONFIG.senzaTempo) el.tempo.hidden = true; }
function iniziaPartita() {
  Object.assign(CONFIG, { senzaTempo: false }, DIFFICOLTA[S.diff]);
  S.livello = +$("inLivello").value || 1; S.livelloPartenza = S.livello; S.base = S.livello > 1 ? sogliaLivello(S.livello - 1) : 0;
  S.punti = 0; S.vite = CONFIG.vite; S.serie = 0; S.firma = ""; S.visti = new Set();
  mostraGioco(true); nuovoPrato();                       // prato disegnato prima dei tutorial, tempo fermo
  tutorialFinoA(S.livello, () => { messaggio(t("porta"), ""); avviaTempo(); avviaLoop(); });
}
function classificaIniziale() {
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  const lista = leggiClassifica(); $("classificaInizio").innerHTML = "";
  if (lista.length) { const ol = document.createElement("ol"); ol.className = "classifica"; mostraClassifica(ol, lista.slice(0, 5)); $("classificaInizio").appendChild(ol); }
}
$("formInizio").addEventListener("submit", e => {
  e.preventDefault(); S.nome = $("inNome").value.trim().slice(0, 10) || "Ape";
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  $("schermoInizio").hidden = true; iniziaPartita();
});
$("bContinua").addEventListener("click", () => { $("schermoLivello").hidden = true; nuovoPrato(); tutorialFinoA(S.livello, () => { messaggio(t("nuovoLiv"), ""); avviaTempo(); avviaLoop(); }); });
$("bRigioca").addEventListener("click", () => { $("schermoFine").hidden = true; $("inNome").value = S.nome; classificaIniziale(); $("formInizio").scrollTop = 0; $("schermoInizio").hidden = false; mostraGioco(false); });
document.querySelectorAll('input[name="diff"]').forEach(r => r.addEventListener("change", classificaIniziale));
window.addEventListener("resize", () => { if (!el.campo.hidden) el.campo.style.setProperty("--cella", `calc(${el.campo.clientWidth}px / ${S.N})`); });
document.documentElement.lang = L;
document.title = L === "en" ? "Pollinator" : "Impollinatrice";
document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
// ===================== uscita durante la partita =====================
$("bEsci").addEventListener("click", () => {
  if (S.fase === "fine") { location.href = "index.html"; return; }
  S.pausaDa = Date.now(); fermaLoop();
  $("esciTesto").textContent = S.punti === 0 ? t("esciNiente") : t("esciTesto")(S.punti);
  $("bSalvaEsci").textContent = S.punti === 0 ? t("esciSolo") : t("esciSalva");
  $("schermoEsci").hidden = false; $("bResta").focus({ preventScroll: true });
});
$("bResta").addEventListener("click", () => {
  $("schermoEsci").hidden = true;
  const dt = Date.now() - (S.pausaDa || Date.now());
  if (typeof S.scade === "number") S.scade += dt;
  if (Array.isArray(S.alberi)) S.alberi.forEach(a => a.scade += dt);
  if (S.fiore && S.fiore.scade) S.fiore.scade += dt;
  if (!document.querySelector(".velo:not([hidden])")) avviaLoop();
});
$("bSalvaEsci").addEventListener("click", () => { if (S.punti > 0) salvaPunteggio(S.nome, S.punti, S.livello, S.livelloPartenza); location.href = "index.html"; });
classificaIniziale();
</script>
