<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Fabbrica del miele</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:600 800;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
/* Layout: barra stato, titolo del processo, pila di carte da riordinare (tocca due carte per scambiarle), barra tempo, ESEGUI */
:root{
  --sky:#dcf1fb; --meadow:#9bd56a; --honey:#f6b73c; --honey-d:#c98610; --ink:#3b2a10; --ink-soft:#7a6240; --paper:#fffaf0;
  --danger:#c0332a; --ok:#2a7527; --sky-d:#2d7fc1; --sel:#ffe08a;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
button{font-family:var(--display);font-weight:700;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
[hidden]{display:none!important}

.stato{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--paper);border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:15px}
.stato .nome{font-family:var(--display);font-size:18px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stato .vite{letter-spacing:2px;font-size:18px}
.stato .punti{font-family:var(--display);font-size:22px;color:var(--honey-d)}
.stato small{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stato > div{white-space:nowrap;flex-shrink:0}
.stato .nome{flex-shrink:1}
@media (max-width:400px){.stato{padding:6px 8px;gap:6px}.stato small{display:none}.stato .vite{letter-spacing:0;font-size:16px}.stato .nome{max-width:28%;font-size:16px}.stato .punti{font-size:20px}}

.processo{width:100%;max-width:520px;text-align:center;font-family:var(--display);font-size:20px;color:var(--honey-d)}
.carte{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:auto;justify-content:flex-start}
.carte > :first-child{margin-top:auto} .carte > :last-child{margin-bottom:auto}
.carta{display:grid;grid-template-columns:30px 40px 1fr auto;align-items:center;gap:6px;background:var(--paper);border-radius:14px;padding:4px 4px 4px 8px;
  border:3px solid transparent;box-shadow:0 4px 0 #d9cdb3;font-size:16px;line-height:1.2;cursor:pointer;transition:transform .15s,border-color .15s}
.carta .num{font-family:var(--display);font-size:20px;color:var(--ink-soft);text-align:center}
.carta .em{font-size:30px;text-align:center;line-height:1}
.carta .testo{min-width:0}
.carta.sel{border-color:var(--honey-d);background:var(--sel);transform:scale(1.02)}
.carta.ok{border-color:var(--ok);background:#e2f3dc}
.carta.male{border-color:var(--danger);background:#fbe1dd}
.carta .x{min-width:44px;height:44px;border-radius:10px;background:#fbe1dd;color:var(--danger);font-size:16px;padding:0 6px;white-space:nowrap}
.carta .x:hover{background:var(--danger);color:#fff}

.tempo{width:100%;max-width:520px;height:14px;background:var(--paper);border-radius:999px;overflow:hidden;position:relative}
.tempo i{position:absolute;inset:0;background:var(--honey);transform-origin:left;transition:transform .1s linear,background .2s}
.tempo.urgente i{background:var(--danger)}
.msg{min-height:22px;line-height:1.25;font-size:clamp(13px,3.9vw,15px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-soft);text-align:center;width:100%;max-width:520px}
.msg.bene{color:var(--ok)}.msg.male{color:var(--danger)}
.azioni{width:100%;max-width:520px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px}
#bMescola{font-size:clamp(15px,4.6vw,20px);white-space:nowrap;padding:0 6px;overflow:hidden;text-overflow:ellipsis}
.azioni button{border-radius:14px;height:54px;font-size:22px;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 #d9cdb3}
.azioni button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cdb3}
.azioni .invia{background:var(--honey);box-shadow:0 4px 0 var(--honey-d);letter-spacing:.04em}
.azioni .invia:active{box-shadow:0 1px 0 var(--honey-d)}

.velo{position:fixed;inset:0;background:rgba(40,30,10,.55);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:20}
.scheda{position:relative;background:var(--paper);border-radius:22px;padding:22px 20px;width:100%;max-width:420px;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.scheda h1{font-size:34px;color:var(--honey-d)}
.scheda h2{font-size:30px}
.scheda p{margin:0;line-height:1.45}
.scheda input{font:inherit;font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid var(--honey);text-align:center;width:100%}
.casa{position:absolute;top:8px;left:8px;width:44px;height:44px;display:grid;place-items:center;font-size:24px;text-decoration:none;line-height:1;padding:0;border-radius:12px}
.casa:hover{background:var(--sky)}
.grande{background:var(--honey);color:var(--ink);border-radius:14px;padding:12px 18px;font-size:22px;box-shadow:0 4px 0 var(--honey-d)}
.grande:active{transform:translateY(3px);box-shadow:0 1px 0 var(--honey-d)}
.regole{text-align:left;font-size:15px;display:grid;gap:6px;padding:0;margin:0;list-style:none}
.regole li{display:flex;gap:10px;align-items:center}
.regole .em{font-size:24px;flex:0 0 46px;text-align:center}
.livelli{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.livelli label{position:relative;display:block}
.livelli input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.livelli span{display:block;padding:12px 2px;border-radius:12px;background:var(--sky);font-family:var(--display);font-size:clamp(13px,3.8vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid transparent;min-height:44px}
.livelli input:checked + span{background:var(--honey);border-color:var(--honey-d)}
.livelli input:focus-visible + span{outline:3px solid var(--sky-d);outline-offset:2px}
.partenza{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:16px}
.partenza select{font:inherit;font-size:18px;padding:6px 10px;border-radius:12px;border:2px solid var(--honey);background:var(--paper);color:var(--ink);min-height:44px}
.partenza select:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
.curiosita{background:var(--sky);border-radius:14px;padding:12px;text-align:left}
.curiosita b{font-family:var(--display);color:var(--sky-d)}
.soluzione{display:flex;flex-direction:column;gap:6px;text-align:left}
.soluzione div{display:grid;grid-template-columns:28px 36px 1fr;gap:6px;align-items:center;background:var(--sky);border-radius:10px;padding:6px 8px;font-size:15px}
.soluzione .em{font-size:24px;text-align:center}
.classifica{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.classifica li{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;padding:4px 8px;border-radius:8px;font-size:16px}
.classifica li.io{background:var(--honey)}
.classifica li span:last-child{color:var(--ink-soft);font-size:13px}
.classifica .pt{font-family:var(--display);font-size:18px}
.esito-grande{font-family:var(--display);font-size:52px;color:var(--honey-d);line-height:1}
@media (max-height:720px){.scheda{padding:16px 16px;gap:10px}.scheda h1{font-size:30px}.scheda p{font-size:15px;line-height:1.35}.regole{gap:4px;font-size:14px}.regole .em{font-size:20px;flex-basis:36px}#classificaInizio .classifica li{padding:2px 8px;font-size:14px}}
.stato .esci{flex:0 0 auto;width:36px;height:36px;margin:-4px 0 -4px -6px;display:grid;place-items:center;font-size:20px;text-decoration:none;border-radius:10px;line-height:1}
.stato .esci:active{background:var(--sky)}
</style>
</head>
<body>

<div class="stato" id="stato" hidden>
  <a class="esci" href="index.html" aria-label="Menu">🏠</a>
  <div class="nome" id="sNome">—</div>
  <div><small id="sDiff"></small> <b id="sLivello">1</b></div>
  <div class="vite" id="sVite"></div>
  <div class="punti" id="sPunti">0</div>
</div>
<div class="processo" id="processo" hidden></div>
<div class="carte" id="carte" hidden></div>
<div class="tempo" id="tempo" hidden><i id="tempoBarra"></i></div>
<div class="msg" id="msg" hidden></div>
<div class="azioni" id="azioni" hidden>
  <button id="bMescola" data-t="annulla"></button>
  <button class="invia" id="bInvia" data-t="invia"></button>
</div>

<div class="velo" id="schermoInizio">
  <form class="scheda" id="formInizio">
    <a class="casa" href="index.html" aria-label="Menu">🏠</a>
    <h1 data-t="titolo"></h1>
    <p data-t="intro"></p>
    <ul class="regole">
      <li><span class="em">🔀</span><span data-t="r1"></span></li>
      <li><span class="em">👆</span><span data-t="r2"></span></li>
      <li><span class="em">🐛</span><span data-t="r3"></span></li>
      <li><span class="em">⏳</span><span data-t="r4"></span></li>
    </ul>
    <input id="inNome" maxlength="10" data-ph="nome" autocomplete="off" required>
    <div class="livelli" role="radiogroup">
      <label><input type="radio" name="diff" value="facile" checked><span data-t="facile"></span></label>
      <label><input type="radio" name="diff" value="medio"><span data-t="medio"></span></label>
      <label><input type="radio" name="diff" value="difficile"><span data-t="difficile"></span></label>
      <label><input type="radio" name="diff" value="senzafretta"><span data-t="senzafretta"></span></label>
    </div>
    <label class="partenza"><span data-t="partiDa"></span> <select id="inLivello"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label>
    <button class="grande" type="submit" data-t="gioca"></button>
    <div id="classificaInizio"></div>
  </form>
</div>

<div class="velo" id="schermoLivello" hidden>
  <div class="scheda">
    <div class="esito-grande">🎉</div>
    <h2 id="lvTitolo"></h2>
    <p id="lvTesto"></p>
    <div class="curiosita"><b data-t="sapevi"></b><br><span id="lvCuriosita"></span></div>
    <button class="grande" id="bContinua" data-t="continua"></button>
  </div>
</div>

<div class="velo" id="schermoTutorial" hidden>
  <div class="scheda">
    <div class="esito-grande" id="tuEm"></div>
    <h2 id="tuTitolo"></h2>
    <p id="tuTesto"></p>
    <button class="grande" id="bTutorialOk" data-t="capito"></button>
  </div>
</div>

<div class="velo" id="schermoSoluzione" hidden>
  <div class="scheda">
    <div class="esito-grande">💡</div>
    <h2 data-t="solTitolo"></h2>
    <p id="solTesto"></p>
    <div class="soluzione" id="solLista"></div>
    <button class="grande" id="bSoluzioneOk" data-t="continua"></button>
  </div>
</div>

<div class="velo" id="schermoFine" hidden>
  <div class="scheda">
    <div class="esito-grande">🏭</div>
    <h2 data-t="fine"></h2>
    <p id="fnTesto"></p>
    <ol class="classifica" id="classificaFine"></ol>
    <button class="grande" id="bRigioca" data-t="rigioca"></button>
  </div>
</div>

    serviva: "That step is needed! I put it back.", servivaPenale: "That step is needed! I put it back (−5 s).", bravo: "Perfect order!", primo: " (first try!)", serie: " · streak ×",
    solTitolo: "The right order was:", solNota: "",
    lvTesto: (p, s) => `You have ${p} points. You now get ${s} seconds per job.`, lvTestoSenzaTempo: p => `You have ${p} points. Take all the time you want.`, vitaExtra: " You earned an extra life! ❤️",
    fnTesto: (n, p, d, l) => `${n}, you scored ${p} points (${d}) and reached level ${l}.`, posizione: p => ` You are number ${p} on the leaderboard!`,
    nessuno: "No scores yet. You'll be the first!", diffNomi: { facile: "Easy", medio: "Medium", difficile: "Hard", senzafretta: "No rush" },
    tutorial: {
      1: { em: "👆", titolo: "How to play", testo: "The cards are the steps of a job, but shuffled. Tap a card (it turns yellow), then tap the place it should go: the two cards swap. When you think the order is right, press RUN." },
      bug: { em: "🐛", titolo: "Watch out for the bug!", testo: "A bug is a mistake in the program. Here the bug is an intruder card: find it and remove it with 🐛✕ before pressing RUN." },
    },
    processi: [
      { titolo: "How honey is made", min: 1, fasi: [["🌸", "The bee collects nectar from flowers"], ["🐝", "She passes it mouth to mouth to a house bee"], ["🍯", "The nectar goes into a comb cell"], ["💨", "Bees fan their wings to dry it"], ["🕯️", "The cell is sealed with wax"]] },
      { titolo: "A bee's life", min: 1, fasi: [["🥚", "The queen lays an egg in a cell"], ["🐛", "A larva hatches from the egg"], ["🍼", "Nurse bees feed it"], ["🛌", "The cell is sealed and the larva becomes a pupa, like a butterfly in its cocoon"], ["🐝", "An adult bee comes out"]] },
      { titolo: "Pollen", min: 1, fasi: [["🌼", "The bee rolls in a flower and gets covered in pollen"], ["🦵", "She brushes it into the baskets on her back legs"], ["🏠", "She flies back to the hive"], ["📦", "She unloads the pollen into a cell"], ["🍞", "The pollen becomes bee bread"]] },
      { titolo: "A queen is born", min: 1, fasi: [["👑", "The bees choose a larva"], ["🏰", "They enlarge her cell and make it big"], ["🥛", "They feed her only royal jelly"], ["🐝", "The new queen is born"], ["✈️", "She takes her mating flight"]] },
      { titolo: "A forager's day", min: 1, fasi: [["🌅", "She leaves the hive at dawn"], ["🔍", "She looks for flowers"], ["🌸", "She collects nectar and pollen"], ["🏠", "She flies back to the hive"], ["💃", "She dances to tell her sisters where the flowers were"]] },
      { titolo: "Building the comb", min: 1, fasi: [["🍯", "The bees eat lots of honey"], ["🧈", "They make wax flakes from their belly"], ["🤲", "They knead them with their jaws"], ["⬡", "They build six-sided cells"], ["🥚", "The queen lays eggs in the new cells"]] },
      { titolo: "Winter in the hive", min: 1, fasi: [["🍂", "In autumn the bees gather the last supplies"], ["🚪", "They seal the cracks with propolis"], ["🧶", "They huddle in a cluster around the queen"], ["💪", "They shiver their muscles to make heat"], ["🌱", "In spring they start going out again"]] },
    ],
    bug: [["🍕", "Orders a pizza"], ["🚗", "Drives a car"], ["📺", "Watches TV"], ["⚽", "Plays football"], ["🛒", "Goes shopping"], ["🎸", "Plays the guitar"], ["🛏️", "Sleeps until noon"], ["🧊", "Puts everything in the fridge"]],
    curiosita: ["Nectar becomes honey when bees dry it: from 80% water to less than 18%.", "A jar of honey takes about 50,000 flights.",
      "Honey never goes bad: 3,000-year-old honey has been found still good.", "A bee is born in 21 days; a queen in only 16.",
      "Bee bread is fermented pollen: young bees eat it to make food for the larvae.", "Royal jelly turns a larva that would have been a normal bee into a queen."] },
};
const t = k => T[L][k];

// ===================== stato =====================
const S = { nome: "", diff: "facile", livello: 1, base: 0, punti: 0, vite: 3, serie: 0, proc: null, carte: [], sel: -1, tentativi: 0,
  fase: "fermo", loop: null, scade: 0, totale: 0, firma: "", bugSpiegato: false };
const $ = id => document.getElementById(id);
const el = { stato: $("stato"), processo: $("processo"), carte: $("carte"), tempo: $("tempo"), msg: $("msg"), azioni: $("azioni") };
const tempoLivello = lv => Math.max(CONFIG.tempoMin, CONFIG.tempoLivello * Math.pow(1 - CONFIG.riduzionePerLivello, lv - 1));
const sogliaLivello = lv => CONFIG.soglie[Math.min(lv, CONFIG.soglie.length) - 1] + Math.max(0, lv - CONFIG.soglie.length) * 3000;
const mescola = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function nuovoLavoro() {
  const nCarte = Math.min(5, 2 + S.livello);
  const nBug = S.livello >= CONFIG.dueBugDalLivello ? 2 : S.livello >= CONFIG.bugDalLivello ? 1 : 0;
  const possibili = t("processi").filter(p => p.min <= S.livello);
  let proc, firma, tent = 0;
  do { proc = possibili[Math.floor(Math.random() * possibili.length)]; firma = proc.titolo + nCarte; } while (firma === S.firma && possibili.length > 1 && ++tent < 20);
  S.firma = firma; S.proc = proc;
  // prendo le prime nCarte fasi del processo (l'ordine resta sensato)
  const fasi = proc.fasi.slice(0, nCarte).map((f, i) => ({ em: f[0], testo: f[1], ordine: i, bug: false }));
  // intrusi: carte buffe nei primi livelli; dal livello dueBugDalLivello (o comunque dal 6) fasi vere di un altro processo
  const seri = S.livello >= Math.min(6, CONFIG.dueBugDalLivello);
  const altre = seri ? t("processi").filter(p => p !== proc).flatMap(p => p.fasi).filter(f => !fasi.some(c => c.em === f[0] || c.testo === f[1])) : t("bug");
  const bugs = mescola([...altre]).slice(0, nBug).map(b => ({ em: b[0], testo: b[1], ordine: -1, bug: true }));
  let carte;
  do { carte = mescola([...fasi, ...bugs]); } while (carte.filter(c => !c.bug).every((c, i, a) => i === 0 || a[i - 1].ordine < c.ordine));
  S.carte = carte; S.sel = -1; S.tentativi = 0; S.fase = "fermo"; S.conBug = nBug > 0;
  S.totale = tempoLivello(S.livello) * 1000; S.scade = Date.now() + S.totale;
  if (CONFIG.senzaTempo) $("tempoBarra").style.transform = "none";
  el.processo.textContent = proc.titolo;
  aggiornaStato(); disegna();
}
function aggiornaStato() {
  $("sNome").textContent = S.nome; $("sLivello").textContent = t("liv") + " " + S.livello; $("sDiff").textContent = t("diffNomi")[S.diff]; $("sPunti").textContent = S.punti;
  $("sVite").textContent = "❤️".repeat(S.vite) + "🤍".repeat(Math.max(0, CONFIG.viteMax - S.vite));
}
function disegna(esito) {
  el.carte.innerHTML = S.carte.map((c, i) => {
    let cls = i === S.sel ? " sel" : "";
    if (esito) cls += esito[i] ? " ok" : " male";
    return `<div class="carta${cls}" data-i="${i}" role="button" tabindex="0"><span class="num">${i + 1}</span><span class="em">${c.em}</span><span class="testo">${c.testo}</span>${S.conBug ? `<button class="x" data-x="${i}" aria-label="✕">🐛✕</button>` : ""}</div>`;
  }).join("");
}
function messaggio(m, tipo) { el.msg.textContent = m; el.msg.className = "msg " + (tipo || ""); }

// ===================== interazione =====================
el.carte.addEventListener("click", e => {
  if (S.fase !== "fermo") return;
  const x = e.target.closest("[data-x]");
  if (x) { togli(+x.dataset.x); return; }
  const c = e.target.closest(".carta"); if (!c) return;
  const i = +c.dataset.i;
  if (S.sel < 0) { S.sel = i; }
  else if (S.sel === i) { S.sel = -1; }
  else { [S.carte[S.sel], S.carte[i]] = [S.carte[i], S.carte[S.sel]]; S.sel = -1; }
  disegna();
});
function togli(i) {
  const c = S.carte[i];
  if (!c.bug) {
    // togliere una fase giusta costa 5 secondi (mai sotto il tempo attuale); senza tempo nessuna penalità
    if (CONFIG.senzaTempo) messaggio(t("serviva"), "male"); else { S.scade = Math.max(Date.now(), S.scade - 5000); messaggio(t("servivaPenale"), "male"); }
    S.carte.splice(i, 1); disegna(); setTimeout(() => { S.carte.splice(i, 0, c); S.sel = -1; disegna(); }, 500); return;
  }
  S.carte.splice(i, 1); S.sel = -1; disegna();
}
$("bMescola").addEventListener("click", () => { if (S.fase !== "fermo") return; mescola(S.carte); S.sel = -1; disegna(); });
$("bInvia").addEventListener("click", invia);
document.addEventListener("keydown", e => { if (el.azioni.hidden || e.target.tagName === "INPUT") return; if (e.key === "Enter") { e.preventDefault(); invia(); } });

function invia() {
  if (S.fase !== "fermo") return;
  S.tentativi++;
  const bugResta = S.carte.some(c => c.bug);
  const esito = S.carte.map((c, i) => !c.bug && c.ordine === S.carte.filter(x => !x.bug).indexOf(c) && S.carte.slice(0, i).every(x => !x.bug));
  const giusto = !bugResta && S.carte.every((c, i) => c.ordine === i);
  if (giusto) { successo(); return; }
  disegna(S.carte.map(c => !c.bug && S.carte.indexOf(c) === c.ordine));
  if (!perdiVita(bugResta ? t("bugResta") : t("sbagliato"))) return;
}
function perdiVita(testo) {
  S.vite--; S.serie = 0; aggiornaStato(); messaggio(testo, "male");
  if (S.vite <= 0) { fineGioco(); return false; }
  return true;
}
function successo() {
  S.fase = "ok";
  const rimasto = CONFIG.senzaTempo ? S.totale : Math.max(0, S.scade - Date.now());
  const bonus = Math.round(CONFIG.punti.bonusVelocita * rimasto / S.totale);
  const primo = S.tentativi === 1 ? CONFIG.punti.bonusPrimoColpo : 0;
  const molt = 1 + Math.min(CONFIG.punti.serieMax, S.serie * CONFIG.punti.serieStep);
  const guadagno = Math.round((CONFIG.punti.base + CONFIG.punti.perCarta * S.carte.length + bonus + primo) * molt);
  S.punti += guadagno; S.serie++; aggiornaStato();
  disegna(S.carte.map(() => true));
  messaggio(`${t("bravo")} +${guadagno}` + (primo ? t("primo") : "") + (S.serie > 1 ? `${t("serie")}${S.serie}` : ""), "bene");
  if (S.base + S.punti >= sogliaLivello(S.livello)) { setTimeout(salitaLivello, 700); return; }
  setTimeout(nuovoLavoro, 1100);
}
function mostraSoluzione(testo) {
  fermaLoop(); S.fase = "pausa";
  $("solTesto").textContent = testo;
  $("solLista").innerHTML = S.proc.fasi.slice(0, Math.min(5, 2 + S.livello)).map((f, i) => `<div><b>${i + 1}.</b><span class="em">${f[0]}</span><span>${f[1]}</span></div>`).join("");
  $("schermoSoluzione").hidden = false; $("bSoluzioneOk").focus({ preventScroll: true });
  $("bSoluzioneOk").onclick = () => { $("schermoSoluzione").hidden = true; nuovoLavoro(); avviaLoop(); };
}

// ===================== tempo =====================
function tick() {
  if (S.fase !== "fermo" || CONFIG.senzaTempo) return;
  const resto = S.scade - Date.now();
  $("tempoBarra").style.transform = `scaleX(${Math.max(0, resto / S.totale)})`;
  el.tempo.classList.toggle("urgente", resto < 5000);
  if (resto <= 0) { if (!perdiVita(t("tardi"))) return; mostraSoluzione(t("tardi")); }
}
function avviaLoop() { fermaLoop(); S.loop = setInterval(tick, 100); }
function fermaLoop() { if (S.loop) clearInterval(S.loop); S.loop = null; }

// ===================== livelli, fine, classifica =====================
function salitaLivello() {
  fermaLoop(); S.livello++;
  let extra = "";
  if ((S.livello - 1) % CONFIG.vitaOgniLivelli === 0 && S.vite < CONFIG.viteMax) { S.vite++; extra = t("vitaExtra"); }
  $("lvTitolo").textContent = `${t("livello")} ${S.livello}!`;
  $("lvTesto").textContent = (CONFIG.senzaTempo ? t("lvTestoSenzaTempo")(S.punti) : t("lvTesto")(S.punti, Math.round(tempoLivello(S.livello)))) + extra;
  $("lvCuriosita").textContent = t("curiosita")[(S.livello - 2) % t("curiosita").length];
  $("schermoLivello").hidden = false; $("bContinua").focus({ preventScroll: true });
}
function fineGioco() {
  fermaLoop(); S.fase = "fine";
  const classifica = salvaPunteggio(S.nome, S.punti, S.livello);
  const posizione = classifica.findIndex(r => r.io) + 1;
  $("fnTesto").textContent = t("fnTesto")(S.nome, S.punti, t("diffNomi")[S.diff], S.livello) + (posizione > 0 ? t("posizione")(posizione) : "");
  mostraClassifica($("classificaFine"), classifica);
  $("schermoFine").hidden = false; $("bRigioca").focus({ preventScroll: true });
}
const chiave = () => "fabbrica.classifica." + S.diff;
function leggiClassifica() { try { return JSON.parse(localStorage.getItem(chiave())) || []; } catch (e) { return []; } }
function salvaPunteggio(nome, punti, livello) {
  const lista = leggiClassifica().map(r => ({ ...r, io: false }));
  lista.push({ nome, punti, livello, io: true });
  lista.sort((a, b) => b.punti - a.punti);
  const top = lista.slice(0, CONFIG.classificaMax);
  try { localStorage.setItem(chiave(), JSON.stringify(top.map(({ nome, punti, livello }) => ({ nome, punti, livello })))); } catch (e) {}
  return top;
}
function mostraClassifica(ol, lista) {
  ol.innerHTML = lista.length ? lista.map((r, i) => `<li class="${r.io ? "io" : ""}"><b>${i + 1}.</b><span>${r.nome.replace(/[<>&]/g, "")}</span><span class="pt">${r.punti}</span><span>${t("liv").toLowerCase()} ${r.livello}</span></li>`).join("")
    : `<li><span></span><span>${t("nessuno")}</span></li>`;
}

// ===================== tutorial e avvio =====================
function mostraTutorial(k, poi) {
  const tu = t("tutorial")[k]; if (!tu) { poi(); return; }
  $("tuEm").textContent = tu.em; $("tuTitolo").textContent = tu.titolo; $("tuTesto").textContent = tu.testo;
  $("schermoTutorial").hidden = false; $("bTutorialOk").focus({ preventScroll: true });
  $("bTutorialOk").onclick = () => { $("schermoTutorial").hidden = true; poi(); };
}
// all'inizio (anche partendo da un livello alto) mostra il tutorial 1 e poi, se serve, quello del bug
function tutorialLivello(poi, inizio) {
  if (inizio) { mostraTutorial(1, () => tutorialLivello(poi)); return; }
  if (!S.bugSpiegato && S.livello >= CONFIG.bugDalLivello) { S.bugSpiegato = true; mostraTutorial("bug", poi); return; }
  poi();
}
function mostraGioco(v) { [el.stato, el.processo, el.carte, el.tempo, el.msg, el.azioni].forEach(e => e.hidden = !v); if (v && CONFIG.senzaTempo) el.tempo.hidden = true; }
function iniziaPartita() {
  Object.assign(CONFIG, { senzaTempo: false }, DIFFICOLTA[S.diff]);
  S.livello = Math.min(9, Math.max(1, +$("inLivello").value || 1)); S.punti = 0; S.base = S.livello > 1 ? sogliaLivello(S.livello - 1) : 0;   // partendo da un livello alto le soglie si contano da lì
  S.vite = CONFIG.vite; S.serie = 0; S.firma = ""; S.bugSpiegato = false;
  mostraGioco(true); el.tempo.classList.remove("urgente"); tutorialLivello(() => { nuovoLavoro(); messaggio(t("porta"), ""); avviaLoop(); }, true);
}
function classificaIniziale() {
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  const lista = leggiClassifica(); $("classificaInizio").innerHTML = "";
  if (lista.length) { const ol = document.createElement("ol"); ol.className = "classifica"; mostraClassifica(ol, lista.slice(0, 5)); $("classificaInizio").appendChild(ol); }
}
$("formInizio").addEventListener("submit", e => {
  e.preventDefault(); S.nome = $("inNome").value.trim().slice(0, 10) || "Ape";
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  $("schermoInizio").hidden = true; iniziaPartita();
});
$("bContinua").addEventListener("click", () => { $("schermoLivello").hidden = true; tutorialLivello(() => { nuovoLavoro(); messaggio(t("nuovoLiv"), ""); avviaLoop(); }); });
$("bRigioca").addEventListener("click", () => { $("schermoFine").hidden = true; $("inNome").value = S.nome; classificaIniziale(); $("formInizio").scrollTop = 0; $("schermoInizio").hidden = false; mostraGioco(false); });
document.querySelectorAll('input[name="diff"]').forEach(r => r.addEventListener("change", classificaIniziale));
document.documentElement.lang = L;
document.title = L === "en" ? "Honey Factory" : "Fabbrica del miele";
document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
classificaIniziale();
</script>
</body>
