<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Danza dell'ape</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:600 800;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
/* Layout: come Ape Coder (barra stato, griglia quadrata, riga del programma, tastiera) con in più il blocco RIPETI */
:root{
  --sky:#dcf1fb; --meadow:#9bd56a; --meadow2:#b4e284; --honey:#f6b73c; --honey-d:#c98610;
  --ink:#3b2a10; --ink-soft:#7a6240; --paper:#fffaf0; --danger:#e14b3b; --ok:#3a9a37; --sky-d:#2d7fc1; --loop:#c8a0e8; --loop-d:#8e5cc0;
  --display:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
button{font-family:var(--display);font-weight:700;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px}
[hidden]{display:none!important}

.stato{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--paper);border-radius:14px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:15px}
.stato .nome{font-family:var(--display);font-size:18px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stato .vite{letter-spacing:2px;font-size:18px}
.stato .punti{font-family:var(--display);font-size:22px;color:var(--honey-d)}
.stato small{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}

.campo{position:relative;width:min(100%,520px,calc(100dvh - 330px));aspect-ratio:1;max-width:100%;
  background:var(--meadow);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 #6fae43}
.griglia{position:absolute;inset:0;display:grid}
.cella{border:1px solid rgba(255,255,255,.28)}
.cella:nth-child(odd){background:var(--meadow2)}
.ent{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:1}
.ent .em{font-size:calc(var(--cella) * .62)}
.fiore.preso .em{opacity:.35}
.fiore.preso::after{content:"✔";position:absolute;font-size:calc(var(--cella) * .45);color:var(--ok);font-weight:900}
.ape{transition:left .28s linear,top .28s linear;z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.ape.salto{transition:none}
.alveare svg{width:78%;height:78%}
@media (prefers-reduced-motion:reduce){.ape{transition-duration:.05s}}

.tempo{width:100%;max-width:520px;height:14px;background:var(--paper);border-radius:999px;overflow:hidden;position:relative}
.tempo i{position:absolute;inset:0;background:var(--honey);transform-origin:left;transition:transform .1s linear,background .2s}
.tempo.urgente i{background:var(--danger)}
.msg{height:22px;font-size:15px;color:var(--ink-soft);text-align:center;width:100%;max-width:520px}
.msg.bene{color:var(--ok)}.msg.male{color:var(--danger)}
.codice{width:100%;max-width:520px;min-height:48px;background:var(--paper);border-radius:14px;padding:6px 10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--display);font-size:19px}
.codice .vuoto{color:var(--ink-soft);font-size:14px;font-family:var(--body)}
.codice .resto{margin-left:auto;font-size:13px;color:var(--ink-soft);font-family:var(--body);white-space:nowrap}
.codice .resto.zero{color:var(--danger)}
.chip{background:var(--honey);color:var(--ink);border-radius:10px;padding:2px 10px;line-height:1.3}
.blocco{display:inline-flex;align-items:center;gap:4px;background:var(--loop);border-radius:12px;padding:3px 6px 3px 8px;color:#2a0f45}
.blocco .n{font-size:15px}
.blocco.aperto{outline:3px dashed var(--loop-d);outline-offset:1px}
.blocco .chip{padding:1px 8px;font-size:17px}

.pad{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;grid-template-rows:repeat(3,54px);gap:8px}
.pad button{border-radius:14px;font-size:26px;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 #d9cdb3}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9cdb3}
.pad .canc{grid-column:1;grid-row:1;font-size:22px}
.pad .su{grid-column:2;grid-row:1}
.pad .rip{grid-column:3;grid-row:1;background:var(--loop);box-shadow:0 4px 0 var(--loop-d);font-size:16px;color:#2a0f45}
.pad .sx{grid-column:1;grid-row:2}.pad .giu{grid-column:2;grid-row:2}.pad .dx{grid-column:3;grid-row:2}
.pad .volte{grid-column:1;grid-row:3;background:var(--loop);box-shadow:0 4px 0 var(--loop-d);font-size:17px;color:#2a0f45}
.pad .chiudi{grid-column:2;grid-row:3;background:var(--loop);box-shadow:0 4px 0 var(--loop-d);font-size:17px;color:#2a0f45}
.pad .aiuto{grid-column:3;grid-row:3;font-family:var(--body);font-size:11px;color:var(--ink-soft);box-shadow:none;background:transparent;font-weight:600;padding:0;line-height:1.2}
.pad .invia{grid-column:4;grid-row:1/4;background:var(--honey);box-shadow:0 4px 0 var(--honey-d);font-size:24px;letter-spacing:.04em}
.pad .invia:active{box-shadow:0 1px 0 var(--honey-d)}
.pad button:disabled{opacity:.4;transform:none;box-shadow:none}

.velo{position:fixed;inset:0;background:rgba(40,30,10,.55);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;z-index:20}
.scheda{position:relative;background:var(--paper);border-radius:22px;padding:22px 20px;width:100%;max-width:420px;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.scheda h1{font-size:36px;color:var(--loop-d)}
.scheda h2{font-size:30px}
.scheda p{margin:0;line-height:1.45}
.scheda input{font:inherit;font-size:22px;padding:10px 14px;border-radius:12px;border:2px solid var(--honey);text-align:center;width:100%}
.casa{position:absolute;top:10px;left:10px;font-size:24px;text-decoration:none;line-height:1;padding:6px;border-radius:10px}
.casa:hover{background:var(--sky)}
.grande{background:var(--honey);color:var(--ink);border-radius:14px;padding:12px 18px;font-size:22px;box-shadow:0 4px 0 var(--honey-d)}
.grande:active{transform:translateY(3px);box-shadow:0 1px 0 var(--honey-d)}
.regole{text-align:left;font-size:15px;display:grid;gap:6px;padding:0;margin:0;list-style:none}
.regole li{display:flex;gap:10px;align-items:center}
.regole .em{font-size:24px;flex:0 0 46px;text-align:center}
.regole .mini{display:inline-flex;justify-content:center;gap:3px;line-height:1}
.regole .mini i{font-style:normal;font-size:12px;height:20px;padding:0 5px;display:grid;place-items:center;background:var(--honey);border-radius:6px;color:var(--ink)}
.regole .mini i.l{background:var(--loop);color:#2a0f45}
.livelli{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.livelli label{position:relative;display:block}
.livelli input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.livelli span{display:block;padding:10px 4px;border-radius:12px;background:var(--sky);font-family:var(--display);font-size:17px;border:2px solid transparent}
.livelli input:checked + span{background:var(--honey);border-color:var(--honey-d)}
.livelli input:focus-visible + span{outline:3px solid var(--sky-d);outline-offset:2px}
.curiosita{background:var(--sky);border-radius:14px;padding:12px;text-align:left}
.curiosita b{font-family:var(--display);color:var(--sky-d)}
.classifica{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.classifica li{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;padding:4px 8px;border-radius:8px;font-size:16px}
.classifica li.io{background:var(--honey)}
.classifica li span:last-child{color:var(--ink-soft);font-size:13px}
.classifica .pt{font-family:var(--display);font-size:18px}
.esito{font-family:var(--display);font-size:52px;color:var(--honey-d);line-height:1}
</style>
</head>
<body>

<div class="stato" id="stato" hidden>
  <div class="nome" id="sNome">—</div>
  <div><small id="sDiff"></small> <b id="sLivello">1</b></div>
  <div class="vite" id="sVite"></div>
  <div class="punti" id="sPunti">0</div>
</div>

<div class="campo" id="campo" hidden><div class="griglia" id="griglia"></div></div>
<div class="tempo" id="tempo" hidden><i id="tempoBarra"></i></div>
<div class="msg" id="msg" hidden></div>
<div class="codice" id="codice" hidden></div>

<div class="pad" id="pad" hidden>
  <button class="canc" id="bCanc" aria-label="Cancella">✕</button>
  <button class="su" data-d="U" aria-label="Su">▲</button>
  <button class="rip" id="bRip" data-t="ripeti"></button>
  <button class="sx" data-d="L" aria-label="Sinistra">◀</button>
  <button class="giu" data-d="D" aria-label="Giù">▼</button>
  <button class="dx" data-d="R" aria-label="Destra">▶</button>
  <button class="volte" id="bVolte" data-t="volte"></button>
  <button class="chiudi" id="bChiudi" data-t="chiudi"></button>
  <button class="aiuto" id="bAiuto" data-t="aiuto"></button>
  <button class="invia" id="bInvia" data-t="invia"></button>
</div>

<div class="velo" id="schermoInizio">
  <form class="scheda" id="formInizio">
    <a class="casa" href="index.html" aria-label="Menu">🏠</a>
    <h1 data-t="titolo"></h1>
    <p data-t="intro"></p>
    <ul class="regole">
      <li><span class="em">🌼</span><span data-t="r1"></span></li>
      <li><span class="em mini"><i class="l">🔁3</i><i>▶</i></span><span data-t="r2"></span></li>
      <li><span class="em">🧱</span><span data-t="r3"></span></li>
      <li><span class="em">⏳</span><span data-t="r4"></span></li>
    </ul>
    <input id="inNome" maxlength="10" data-ph="nome" autocomplete="off" required>
    <div class="livelli" role="radiogroup">
      <label><input type="radio" name="diff" value="facile" checked><span data-t="facile"></span></label>
      <label><input type="radio" name="diff" value="medio"><span data-t="medio"></span></label>
      <label><input type="radio" name="diff" value="difficile"><span data-t="difficile"></span></label>
    </div>
    <button class="grande" type="submit" data-t="gioca"></button>
    <div id="classificaInizio"></div>
  </form>
</div>

<div class="velo" id="schermoLivello" hidden>
  <div class="scheda">
    <div class="esito">🎉</div>
    <h2 id="lvTitolo"></h2>
    <p id="lvTesto"></p>
    <div class="curiosita"><b data-t="sapevi"></b><br><span id="lvCuriosita"></span></div>
    <button class="grande" id="bContinua" data-t="continua"></button>
  </div>
</div>

<div class="velo" id="schermoFine" hidden>
  <div class="scheda">
    <div class="esito">💃</div>
    <h2 data-t="fine"></h2>
    <p id="fnTesto"></p>
    <ol class="classifica" id="classificaFine"></ol>
    <button class="grande" id="bRigioca" data-t="rigioca"></button>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const CONFIG = {
  vite: 3, viteMax: 5, vitaOgniLivelli: 3,
  tempoLivello: 30, riduzionePerLivello: 0.06, tempoMin: 10,   // secondi per completare una figura
  msPerCella: 300, passiMax: 80,
  grigliaMin: 6, grigliaMax: 9,
  punti: { perFiore: 40, bonusVelocita: 150, bonusCorto: 100, serieStep: 0.10, serieMax: 0.5 },
  soglie: [600, 1400, 2400, 3600, 5000, 6600, 8400, 10400, 12600, 15000],
  classificaMax: 10,
};
const DIFFICOLTA = {
  facile:    { tempoLivello: 45, riduzionePerLivello: 0.04, tempoMin: 18, msPerCella: 350, vite: 5, slack: 2 },
  medio:     { tempoLivello: 35, riduzionePerLivello: 0.06, tempoMin: 12, msPerCella: 300, vite: 4, slack: 1 },
  difficile: { tempoLivello: 25, riduzionePerLivello: 0.08, tempoMin: 8,  msPerCella: 280, vite: 3, slack: 1 },
};
// ===================== lingua =====================
function leggiLingua() { try { const l = localStorage.getItem("scuolaApe.lingua"); if (l === "it" || l === "en") return l; } catch (e) {} return (navigator.language || "it").toLowerCase().startsWith("en") ? "en" : "it"; }
const L = leggiLingua();
const T = {
  it: { titolo: "💃 Danza dell'ape", intro: "I fiori formano una figura che si ripete. Scrivi il programma più corto che li visita tutti!",
    r1: "L'ape deve passare su tutti i fiori. Il programma parte dall'alveare.",
    r2: "RIPETI apre un blocco: quello che c'è dentro viene rifatto tante volte. ×+ cambia le volte, ] chiude il blocco.",
    r3: "Hai pochi mattoncini: ogni freccia e ogni RIPETI ne usa uno. Senza RIPETI non ce la fai!",
    r4: "La barra gialla è il tempo. Se finisce, perdi una vita.",
    nome: "Il tuo nome", facile: "🐣 Facile", medio: "🐝 Medio", difficile: "🔥 Difficile", gioca: "GIOCA", invia: "INVIA",
    ripeti: "🔁 RIPETI", volte: "×+", chiudi: "]", aiuto: "Dentro al blocco aperto le frecce vanno nel RIPETI",
    sapevi: "Lo sapevi?", continua: "CONTINUA", fine: "Fine del gioco", rigioca: "RIGIOCA", liv: "Liv.", livello: "Livello",
    vuoto: "Scrivi il programma…", mattoncini: n => `${n} mattoncini`, porta: "Visita tutti i fiori 🌼 con il programma più corto!",
    nuovoLiv: "Nuovo livello: figura nuova!", tardi: "Tempo scaduto! −1 vita", parziale: (a, b) => `Hai visitato ${a} fiori su ${b}. Correggi il programma!`,
    bravo: "Tutti i fiori!", corto: " (programma corto!)", serie: " · serie ×", tropp: "Hai finito i mattoncini: usa RIPETI!",
    lvTesto: (p, s) => `Hai ${p} punti. Ora hai ${s} secondi per ogni figura.`, vitaExtra: " Hai guadagnato una vita in più! ❤️",
    fnTesto: (n, p, d, l) => `${n}, hai fatto ${p} punti (${d}) e sei arrivato al livello ${l}.`, posizione: p => ` Sei in classifica al posto ${p}!`,
    nessuno: "Nessun punteggio ancora. Sarai il primo!", diffNomi: { facile: "Facile", medio: "Medio", difficile: "Difficile" },
    curiosita: ["La danza dell'ape: se balla in cerchio, i fiori sono vicini; se fa un otto, sono lontani.", "Nella danza a otto, l'angolo rispetto al sole dice in che direzione sono i fiori.",
      "Più a lungo l'ape scodinzola durante la danza, più i fiori sono lontani.", "Le api danzano al buio, dentro l'alveare: le compagne la 'leggono' toccandola.",
      "Karl von Frisch ha vinto il premio Nobel nel 1973 per aver decifrato la danza delle api.", "Un'ape può ricordare la posizione di un campo di fiori per giorni."] },
  en: { titolo: "💃 Bee Dance", intro: "The flowers form a repeating shape. Write the shortest program that visits them all!",
    r1: "The bee must fly over every flower. The program starts at the hive.",
    r2: "REPEAT opens a block: what is inside is done again and again. ×+ changes the count, ] closes the block.",
    r3: "You have few blocks: every arrow and every REPEAT uses one. Without REPEAT you can't make it!",
    r4: "The yellow bar is the time. When it runs out, you lose a life.",
    nome: "Your name", facile: "🐣 Easy", medio: "🐝 Medium", difficile: "🔥 Hard", gioca: "PLAY", invia: "GO",
    ripeti: "🔁 REPEAT", volte: "×+", chiudi: "]", aiuto: "While a block is open, arrows go inside the REPEAT",
    sapevi: "Did you know?", continua: "CONTINUE", fine: "Game over", rigioca: "PLAY AGAIN", liv: "Lv.", livello: "Level",
    vuoto: "Write your program…", mattoncini: n => `${n} blocks`, porta: "Visit every flower 🌼 with the shortest program!",
    nuovoLiv: "New level: new shape!", tardi: "Time's up! −1 life", parziale: (a, b) => `You visited ${a} of ${b} flowers. Fix your program!`,
    bravo: "All the flowers!", corto: " (short program!)", serie: " · streak ×", tropp: "No blocks left: use REPEAT!",
    lvTesto: (p, s) => `You have ${p} points. You now get ${s} seconds per shape.`, vitaExtra: " You earned an extra life! ❤️",
    fnTesto: (n, p, d, l) => `${n}, you scored ${p} points (${d}) and reached level ${l}.`, posizione: p => ` You are number ${p} on the leaderboard!`,
    nessuno: "No scores yet. You'll be the first!", diffNomi: { facile: "Easy", medio: "Medium", difficile: "Hard" },
    curiosita: ["The bee dance: a round dance means flowers are near; a figure-eight means they are far.", "In the figure-eight dance, the angle to the sun tells the direction of the flowers.",
      "The longer the bee waggles during the dance, the farther away the flowers are.", "Bees dance in the dark inside the hive: the others 'read' it by touching her.",
      "Karl von Frisch won the Nobel Prize in 1973 for decoding the bee dance.", "A bee can remember where a flower field is for days."] },
};
const t = k => T[L][k];
const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
const FRECCIA = { U: "▲", D: "▼", L: "◀", R: "▶" };
const SVG_ALVEARE = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="6" width="24" height="7" rx="3.5" fill="#f6b73c"/><rect x="5" y="13" width="30" height="7" rx="3.5" fill="#e9a52c"/><rect x="4" y="20" width="32" height="7" rx="3.5" fill="#f6b73c"/><rect x="6" y="27" width="28" height="7" rx="3.5" fill="#e9a52c"/><circle cx="20" cy="30" r="3" fill="#3b2a10"/></svg>';

// ===================== figure: ogni funzione restituisce i fiori e il numero minimo di mattoncini =====================
// mattoncini: ogni freccia = 1, ogni RIPETI = 1. Un RIPETI n[▶ ▶] costa 3.
const FIGURE = [
  { nome: "riga", min: 1, gen: (N, h) => { const k = N >= 7 && Math.random() < .5 ? 2 : 1, n = Math.floor((N - 1) / k); return { fiori: seq(n, i => ({ x: h.x + (i + 1) * k, y: h.y })), ottimo: 1 + k }; } },
  { nome: "colonna", min: 1, gen: (N, h) => { const k = N >= 7 && Math.random() < .5 ? 2 : 1, n = Math.floor((N - 1) / k); return { fiori: seq(n, i => ({ x: h.x, y: h.y - (i + 1) * k })), ottimo: 1 + k }; } },
  { nome: "scala", min: 2, gen: (N, h) => ({ fiori: seq(N - 1, i => ({ x: h.x + i + 1, y: h.y - i - 1 })), ottimo: 3 }) },
  { nome: "scala larga", min: 3, gen: (N, h) => { const n = Math.floor((N - 1) / 2); return { fiori: seq(n, i => ({ x: h.x + 2 * (i + 1), y: h.y - i - 1 })), ottimo: 4 }; } },
  { nome: "angolo", min: 3, gen: (N, h) => { const a = N - 1; return { fiori: seq(a, i => ({ x: h.x + i + 1, y: h.y })).concat(seq(a, i => ({ x: h.x + a, y: h.y - i - 1 }))), ottimo: 4 }; } },
  { nome: "zigzag", min: 4, gen: (N, h) => { const n = Math.floor((N - 1) / 2); let f = []; for (let i = 0; i < n; i++) { f.push({ x: h.x + 2 * i + 1, y: h.y - 1 }); f.push({ x: h.x + 2 * i + 2, y: h.y }); } return { fiori: f, ottimo: 5 }; } },
  { nome: "rettangolo", min: 5, gen: (N, h) => { const a = N - 1, b = Math.min(N - 1, 3 + Math.floor(Math.random() * (N - 3))); let f = [];
      for (let i = 1; i <= a; i++) f.push({ x: h.x + i, y: h.y }); for (let i = 1; i <= b; i++) f.push({ x: h.x + a, y: h.y - i });
      for (let i = 1; i <= a; i++) f.push({ x: h.x + a - i, y: h.y - b }); for (let i = 1; i < b; i++) f.push({ x: h.x, y: h.y - b + i });
      return { fiori: f, ottimo: 8 }; } },
];
function seq(n, f) { const r = []; for (let i = 0; i < n; i++) r.push(f(i)); return r; }

// ===================== stato =====================
const S = { nome: "", diff: "facile", livello: 1, punti: 0, vite: 3, serie: 0, N: 6, alveare: { x: 0, y: 5 }, ape: { x: 0, y: 5 },
  fiori: [], ottimo: 0, budget: 0, prog: [], aperto: null, fase: "fermo", loop: null, scade: 0, totale: 0 };
const $ = id => document.getElementById(id);
const el = { stato: $("stato"), campo: $("campo"), griglia: $("griglia"), tempo: $("tempo"), msg: $("msg"), codice: $("codice"), pad: $("pad") };
const tempoLivello = lv => Math.max(CONFIG.tempoMin, CONFIG.tempoLivello * Math.pow(1 - CONFIG.riduzionePerLivello, lv - 1));
const sogliaLivello = lv => CONFIG.soglie[Math.min(lv, CONFIG.soglie.length) - 1] + Math.max(0, lv - CONFIG.soglie.length) * 3000;

function nuovaFigura() {
  const N = Math.min(CONFIG.grigliaMax, CONFIG.grigliaMin + Math.floor((S.livello - 1) / 2));
  S.N = N; S.alveare = { x: 0, y: N - 1 }; S.ape = { ...S.alveare };
  const possibili = FIGURE.filter(f => f.min <= S.livello);
  const scelte = possibili.slice(-3);                       // le figure più recenti sbloccate
  const fig = scelte[Math.floor(Math.random() * scelte.length)];
  const r = fig.gen(N, S.alveare);
  S.fiori = r.fiori.filter(f => f.x >= 0 && f.x < N && f.y >= 0 && f.y < N).map(f => ({ ...f, preso: false }));
  S.ottimo = r.ottimo; S.budget = r.ottimo + CONFIG.slack;
  S.prog = []; S.aperto = null; S.fase = "fermo";
  S.totale = tempoLivello(S.livello) * 1000; S.scade = Date.now() + S.totale;
  el.griglia.style.gridTemplateColumns = `repeat(${N},1fr)`; el.griglia.style.gridTemplateRows = `repeat(${N},1fr)`;
  el.campo.style.setProperty("--cella", `calc(${el.campo.clientWidth}px / ${N})`);
  disegna();
}

// ===================== disegno =====================
function pos(e, x, y) { const p = 100 / S.N; e.style.left = x * p + "%"; e.style.top = y * p + "%"; e.style.width = p + "%"; e.style.height = p + "%"; }
function ent(cls, html, x, y) { const e = document.createElement("div"); e.className = "ent " + cls; e.innerHTML = html; pos(e, x, y); return e; }
let apeEl = null;
function disegna() {
  el.griglia.innerHTML = "";
  for (let i = 0; i < S.N * S.N; i++) { const c = document.createElement("div"); c.className = "cella"; el.griglia.appendChild(c); }
  el.griglia.appendChild(ent("alveare", SVG_ALVEARE, S.alveare.x, S.alveare.y));
  S.fiori.forEach((f, i) => { const e = ent("fiore" + (f.preso ? " preso" : ""), '<span class="em">🌼</span>', f.x, f.y); e.dataset.i = i; el.griglia.appendChild(e); });
  apeEl = ent("ape salto", '<span class="em">🐝</span>', S.ape.x, S.ape.y);
  el.griglia.appendChild(apeEl);
  requestAnimationFrame(() => apeEl.classList.remove("salto"));
  aggiornaStato(); disegnaCodice();
}
function aggiornaStato() {
  $("sNome").textContent = S.nome; $("sLivello").textContent = t("liv") + " " + S.livello; $("sDiff").textContent = t("diffNomi")[S.diff]; $("sPunti").textContent = S.punti;
  $("sVite").textContent = "❤️".repeat(S.vite) + "🤍".repeat(Math.max(0, CONFIG.viteMax - S.vite));
}
const costo = p => p.reduce((n, c) => n + (c.rep ? 1 + costo(c.body) : 1), 0);
function chipHtml(c, aperto) {
  if (!c.rep) return `<span class="chip">${FRECCIA[c.d]}</span>`;
  return `<span class="blocco${c === aperto ? " aperto" : ""}"><span class="n">🔁${c.n}</span>[${c.body.map(x => chipHtml(x, aperto)).join("")}]</span>`;
}
function disegnaCodice() {
  const resto = S.budget - costo(S.prog);
  el.codice.innerHTML = (S.prog.length ? S.prog.map(c => chipHtml(c, S.aperto)).join("") : `<span class="vuoto">${t("vuoto")}</span>`)
    + `<span class="resto${resto <= 0 ? " zero" : ""}">🧱 ${t("mattoncini")(resto)}</span>`;
  $("bRip").disabled = S.fase !== "fermo" || !!S.aperto || resto <= 0;
  $("bChiudi").disabled = S.fase !== "fermo" || !S.aperto;
  $("bVolte").disabled = S.fase !== "fermo" || !S.prog.some(c => c.rep);
}
function messaggio(m, tipo) { el.msg.textContent = m; el.msg.className = "msg " + (tipo || ""); }

// ===================== tempo =====================
function tick() {
  const ora = Date.now(), resto = S.scade - ora;
  $("tempoBarra").style.transform = `scaleX(${Math.max(0, resto / S.totale)})`;
  el.tempo.classList.toggle("urgente", resto < 5000);
  if (resto <= 0) scaduto();
}
function avviaLoop() { fermaLoop(); S.loop = setInterval(tick, 100); }
function fermaLoop() { if (S.loop) clearInterval(S.loop); S.loop = null; }

// ===================== esiti =====================
function perdiVita(testo) {
  S.vite--; S.serie = 0; aggiornaStato(); messaggio(testo, "male");
  if (S.vite <= 0) { fineGioco(); return false; }
  return true;
}
function scaduto() { S.fase = "fermo"; if (!perdiVita(t("tardi"))) return; nuovaFigura(); }
function successo() {
  const rimasto = Math.max(0, S.scade - Date.now());
  const bonus = Math.round(CONFIG.punti.bonusVelocita * rimasto / S.totale);
  const corto = costo(S.prog) <= S.ottimo ? CONFIG.punti.bonusCorto : 0;
  const molt = 1 + Math.min(CONFIG.punti.serieMax, S.serie * CONFIG.punti.serieStep);
  const guadagno = Math.round((CONFIG.punti.perFiore * S.fiori.length + bonus + corto) * molt);
  S.punti += guadagno; S.serie++;
  messaggio(`${t("bravo")} +${guadagno}` + (corto ? t("corto") : "") + (S.serie > 1 ? `${t("serie")}${S.serie}` : ""), "bene");
  S.fase = "fermo";
  if (S.punti >= sogliaLivello(S.livello)) { salitaLivello(); return; }
  setTimeout(nuovaFigura, 900);
}
function salitaLivello() {
  fermaLoop(); S.livello++;
  let extra = "";
  if ((S.livello - 1) % CONFIG.vitaOgniLivelli === 0 && S.vite < CONFIG.viteMax) { S.vite++; extra = t("vitaExtra"); }
  $("lvTitolo").textContent = `${t("livello")} ${S.livello}!`;
  $("lvTesto").textContent = t("lvTesto")(S.punti, Math.round(tempoLivello(S.livello))) + extra;
  $("lvCuriosita").textContent = t("curiosita")[(S.livello - 2) % t("curiosita").length];
  $("schermoLivello").hidden = false; $("bContinua").focus();
}
function fineGioco() {
  fermaLoop(); S.fase = "fine";
  const classifica = salvaPunteggio(S.nome, S.punti, S.livello);
  const posizione = classifica.findIndex(r => r.io) + 1;
  $("fnTesto").textContent = t("fnTesto")(S.nome, S.punti, t("diffNomi")[S.diff], S.livello) + (posizione > 0 ? t("posizione")(posizione) : "");
  mostraClassifica($("classificaFine"), classifica);
  $("schermoFine").hidden = false; $("bRigioca").focus();
}

// ===================== volo =====================
function espandi(prog, out) { for (const c of prog) { if (c.rep) { for (let i = 0; i < c.n && out.length < CONFIG.passiMax; i++) espandi(c.body, out); } else out.push(c.d); } return out; }
function invia() {
  if (S.fase !== "fermo" || !S.prog.length) return;
  S.aperto = null; S.fase = "volo"; messaggio("", ""); disegnaCodice();
  const passi = espandi(S.prog, []);
  let { x, y } = S.alveare, i = 0;
  S.fiori.forEach(f => f.preso = false);
  el.griglia.querySelectorAll(".fiore").forEach(e => e.classList.remove("preso"));
  S.ape = { x, y }; pos(apeEl, x, y);
  const passo = () => {
    if (S.fase !== "volo") return;
    if (i >= passi.length) { atterra(); return; }
    const [dx, dy] = DIR[passi[i++]];
    x = Math.min(S.N - 1, Math.max(0, x + dx)); y = Math.min(S.N - 1, Math.max(0, y + dy));
    S.ape = { x, y }; pos(apeEl, x, y);
    S.fiori.forEach((f, k) => { if (!f.preso && f.x === x && f.y === y) { f.preso = true; const e = el.griglia.querySelector(`.fiore[data-i="${k}"]`); if (e) e.classList.add("preso"); } });
    setTimeout(passo, CONFIG.msPerCella);
  };
  setTimeout(passo, 150);
}
function atterra() {
  if (S.fase !== "volo") return;
  const presi = S.fiori.filter(f => f.preso).length;
  if (presi === S.fiori.length) { successo(); return; }
  S.fase = "fermo"; messaggio(t("parziale")(presi, S.fiori.length), "male");
  setTimeout(() => { if (S.fase !== "fermo") return; S.ape = { ...S.alveare }; S.fiori.forEach(f => f.preso = false); disegna(); }, 700);
}

// ===================== editor del programma =====================
function lista() { return S.aperto ? S.aperto.body : S.prog; }
function aggiungi(d) {
  if (S.fase !== "fermo") return;
  if (S.budget - costo(S.prog) <= 0) { messaggio(t("tropp"), "male"); return; }
  lista().push({ d }); disegnaCodice();
}
function ripeti() {
  if (S.fase !== "fermo" || S.aperto || S.budget - costo(S.prog) <= 0) return;
  const b = { rep: true, n: 2, body: [] }; S.prog.push(b); S.aperto = b; disegnaCodice();
}
function volte() {
  if (S.fase !== "fermo") return;
  const b = S.aperto || [...S.prog].reverse().find(c => c.rep); if (!b) return;
  b.n = b.n >= 9 ? 2 : b.n + 1; disegnaCodice();
}
function chiudiBlocco() { if (!S.aperto) return; if (!S.aperto.body.length) S.prog.pop(); S.aperto = null; disegnaCodice(); }
function cancella() {
  if (S.fase !== "fermo") return;
  const l = lista();
  if (!l.length) { if (S.aperto) { S.prog.pop(); S.aperto = null; } disegnaCodice(); return; }
  l.pop(); disegnaCodice();
}
el.pad.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => aggiungi(b.dataset.d)));
$("bRip").addEventListener("click", ripeti); $("bVolte").addEventListener("click", volte); $("bChiudi").addEventListener("click", chiudiBlocco);
$("bCanc").addEventListener("click", cancella); $("bInvia").addEventListener("click", invia);
document.addEventListener("keydown", e => {
  if (el.pad.hidden || e.target.tagName === "INPUT") return;
  const k = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R" }[e.key];
  if (k) { e.preventDefault(); aggiungi(k); }
  else if (e.key === "Enter") { e.preventDefault(); invia(); }
  else if (e.key === "Backspace") { e.preventDefault(); cancella(); }
  else if (e.key === "r" || e.key === "[") ripeti();
  else if (e.key === "]") chiudiBlocco();
  else if (e.key === "+") volte();
});

// ===================== classifica =====================
const chiave = () => "danzaApe.classifica." + S.diff;
function leggiClassifica() { try { return JSON.parse(localStorage.getItem(chiave())) || []; } catch (e) { return []; } }
function salvaPunteggio(nome, punti, livello) {
  const lista = leggiClassifica().map(r => ({ ...r, io: false }));
  lista.push({ nome, punti, livello, io: true });
  lista.sort((a, b) => b.punti - a.punti);
  const top = lista.slice(0, CONFIG.classificaMax);
  try { localStorage.setItem(chiave(), JSON.stringify(top.map(({ nome, punti, livello }) => ({ nome, punti, livello })))); } catch (e) {}
  return top;
}
function mostraClassifica(ol, lista) {
  ol.innerHTML = lista.length ? lista.map((r, i) => `<li class="${r.io ? "io" : ""}"><b>${i + 1}.</b><span>${r.nome.replace(/[<>&]/g, "")}</span><span class="pt">${r.punti}</span><span>${t("liv").toLowerCase()} ${r.livello}</span></li>`).join("")
    : `<li><span></span><span>${t("nessuno")}</span></li>`;
}

// ===================== avvio =====================
function mostraGioco(v) { [el.stato, el.campo, el.tempo, el.msg, el.codice, el.pad].forEach(e => e.hidden = !v); }
function iniziaPartita() {
  Object.assign(CONFIG, DIFFICOLTA[S.diff]);
  S.livello = 1; S.punti = 0; S.vite = CONFIG.vite; S.serie = 0;
  mostraGioco(true); nuovaFigura(); messaggio(t("porta"), ""); avviaLoop();
}
function classificaIniziale() {
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  const lista = leggiClassifica(); $("classificaInizio").innerHTML = "";
  if (lista.length) { const ol = document.createElement("ol"); ol.className = "classifica"; mostraClassifica(ol, lista.slice(0, 5)); $("classificaInizio").appendChild(ol); }
}
$("formInizio").addEventListener("submit", e => {
  e.preventDefault(); S.nome = $("inNome").value.trim().slice(0, 10) || "Ape";
  S.diff = (document.querySelector('input[name="diff"]:checked') || {}).value || "facile";
  $("schermoInizio").hidden = true; iniziaPartita();
});
$("bContinua").addEventListener("click", () => { $("schermoLivello").hidden = true; nuovaFigura(); messaggio(t("nuovoLiv"), ""); avviaLoop(); });
$("bRigioca").addEventListener("click", () => { $("schermoFine").hidden = true; $("inNome").value = S.nome; classificaIniziale(); $("schermoInizio").hidden = false; mostraGioco(false); });
document.querySelectorAll('input[name="diff"]').forEach(r => r.addEventListener("change", classificaIniziale));
window.addEventListener("resize", () => { if (!el.campo.hidden) el.campo.style.setProperty("--cella", `calc(${el.campo.clientWidth}px / ${S.N})`); });
document.documentElement.lang = L;
document.title = L === "en" ? "Bee Dance" : "Danza dell'ape";
document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = t(e.dataset.ph));
classificaIniziale();
</script>
</body>
</html>
